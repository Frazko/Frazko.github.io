    const filtered=chapters.filter(c=>matches(c)&&(group==='all'||group===c.group));
    const totalVideos=filtered.reduce((sum,c)=>sum+c.videos.length,0);
    $('main').innerHTML=`<section class="hero"><div><p class="eyebrow">${t('heroTag')}</p><h1>${t('heroTitle')}<em>${t('heroAccent')}</em></h1><p class="hero-copy">${t('heroCopy')}</p><div class="hero-actions"><a href="${href(chapters[0])}" class="button primary">${icon('book')}${t('start')}</a><button class="button quiet" data-scroll="library-section">${t('explore')}</button></div><p class="hero-note">${t('heroNote')}</p></div><div class="agent-map" role="img" aria-label="${esc(t('mapFoot'))}"><div class="map-orbit"></div><div class="map-orbit second"></div><div class="map-label">${t('goal')}</div><div class="map-core">${icon('agent')}<div><strong>${t('agent')}</strong><span>${t('agentSub')}</span></div></div><div class="map-connector"></div><div class="map-tools"><div class="map-tool">${icon('mail')}${t('mail')}</div><div class="map-tool">${icon('file')}${t('docs')}</div><div class="map-tool">${icon('calendar')}${t('calendar')}</div></div><div class="map-foot">${t('mapFoot')}</div></div></section><section id="library-section"><div class="library-header"><h2>${t('yourLibrary')}</h2><span class="counts" role="status" aria-live="polite">${filtered.length} ${filtered.length===1?t('chapter').toLowerCase():t('shown')} · ${totalVideos} ${totalVideos===1?t('video'):t('videos')}</span></div><div class="filter-row" role="group" aria-label="${esc(t('yourLibrary'))}">${['all',...groups].map(g=>`<button class="filter ${group===g?'active':''}" data-group="${g}" aria-pressed="${group===g}">${t(g)}</button>`).join('')}</div><div class="catalog-grid">${filtered.length?filtered.map(card).join(''):`<div class="empty-state"><h3>${t('noResults')}</h3><p>${t('noResultsBody')}</p><button class="button" data-reset>${t('reset')}</button></div>`}</div><div class="missing-note">${icon('info')}<span>${t('gap')}</span></div></section>`;
  }
  function infographicPanel(c) {
    const variant=variants.get(c.id)||0;
    const img=c.images[variant];
    return `<aside class="infographic-panel" id="infographic"><div class="panel-header"><h2>${t('infographic')}</h2><span>${t('original')}</span></div>${c.images.length>1?`<div class="variant-buttons" role="group" aria-label="${esc(t('variantAria'))}">${c.images.map((_,i)=>`<button data-variant="${i}" class="${i===variant?'active':''}" aria-pressed="${i===variant}">${t('variant')} ${i+1}</button>`).join('')}</div>`:''}<button class="image-button" data-zoom aria-label="${esc(t('zoom'))}: ${esc(loc(c.title))}"><img src="${esc(img.src)}" alt="${esc(t('imageLabel'))} ${c.id}: ${esc(loc(c.title))}" width="${img.width}" height="${img.height}" loading="eager"><span class="image-overlay"><span>${icon('search')}${t('zoom')}</span></span></button><div class="panel-actions"><span>PNG · ${img.width} × ${img.height}</span><a href="${esc(img.src)}" download="Capitulo_${pad(c.id)}_${variant+1}.png">${t('download')}</a></div></aside>`;
  }
  function videoCard(v) {
    const parsed=new URL(v.url);
    const id=parsed.hostname==='youtu.be'?parsed.pathname.slice(1):parsed.searchParams.get('v');
    const thumbnail=id&&/^[a-zA-Z0-9_-]{11}$/.test(id)?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:null;
    return `<a class="video-card" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer"><div class="video-thumb">${thumbnail?`<img src="${esc(thumbnail)}" alt="" loading="lazy" width="480" height="360" onerror="this.hidden=true">`:''}<span class="video-play">${icon('play')}</span><span class="video-lang" aria-label="${v.language==='ES'?'Español':'English'}">${esc(v.language)}</span></div><div class="video-info"><div class="video-channel">${esc(v.channel)}</div><h3 lang="${v.language==='ES'?'es':'en'}">${esc(v.title)}</h3><p>${esc(loc(v.note))}</p><span class="video-action">${icon('youtube')}${t('watch')}</span></div></a>`;
  }
  function renderChapter(c) {
    const index=chapters.indexOf(c),prev=chapters[index-1],next=chapters[index+1];
    $('main').innerHTML=`<article><header class="chapter-head"><div class="chapter-meta"><span class="chapter-badge">${t('chapter').toUpperCase()} ${pad(c.id)}</span><span>${t(c.group)}</span><span>·</span><span>${t('general')}</span></div><h1>${esc(loc(c.title))}</h1><p class="intro">${esc(loc(c.intro))}</p><div class="reading-links"><a href="${href(c)}" data-scroll="guide">${icon('book')}${t('guide')}</a><a href="${href(c)}" data-scroll="infographic">${icon('image')}${t('seeImage')}</a><a href="${href(c)}" data-scroll="videos">${icon('youtube')}${t('seeVideos')}</a></div></header><div class="chapter-layout"><div><section class="article-section" id="guide"><h2 class="section-title">${t('how')}</h2><p class="explanation">${esc(loc(c.explanation))}</p></section><section class="article-section"><h2 class="section-title">${t('key')}</h2><div class="concepts">${c.concepts.map(concept=>`<div class="concept">${icon('check')}<div><h3>${esc(loc(concept.title))}</h3><p>${esc(loc(concept.body))}</p></div></div>`).join('')}</div></section><section class="example-box"><p class="box-label">${t('example')}</p><h3>${esc(loc(c.example.title))}</h3><p>${esc(loc(c.example.body))}</p></section><div class="takeaway">${icon('idea')}<div><strong>${t('takeaway')}</strong>${esc(loc(c.takeaway))}</div></div></div>${infographicPanel(c)}</div><section class="resource-section" id="videos"><div class="resource-heading"><h2>${icon('youtube')}${t('seeVideos')}</h2></div><p class="resource-hint">${t('videoHint')}</p><div class="video-grid">${c.videos.map(videoCard).join('')}</div></section><section class="sources"><h2>${t('sources')}</h2><ul>${c.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${icon('link')}${esc(s.title)}</a></li>`).join('')}</ul></section><nav class="chapter-pagination" aria-label="${esc(t('library'))}">${prev?`<a href="${href(prev)}" class="page-link"><small>${t('previous')} · ${pad(prev.id)}</small><strong>${esc(loc(prev.title))}</strong></a>`:`<a href="#inicio" class="page-link"><small>Agents Cookbook</small><strong>${t('back')}</strong></a>`}${next?`<a href="${href(next)}" class="page-link next"><small>${t('next')} · ${pad(next.id)}</small><strong>${esc(loc(next.title))}</strong></a>`:`<a href="#inicio" class="page-link next"><small>${t('finish')}</small><strong>${t('back')}</strong></a>`}</nav></article>`;
  }
  function renderMain() {
    const route=getRoute();
    if(route.home) renderHome();
    else if(route.chapter) renderChapter(route.chapter);
    else $('main').innerHTML=`<section class="not-found"><p class="eyebrow">Agents Cookbook</p><h1>${t('notFound')}</h1><p>${t('notFoundBody')}</p><a href="#inicio" class="button primary">${t('back')}</a></section>`;
    document.title=route.chapter?`${t('chapter')} ${pad(route.chapter.id)} · ${loc(route.chapter.title)} — Agents Cookbook`:`Agents Cookbook — ${t('library')}`;
  }
  function renderAll() {
    document.documentElement.lang=language;
    $('skip').textContent=t('skip');
    $('menu-toggle').innerHTML=icon(drawerOpen?'close':'menu');
    $('menu-toggle').setAttribute('aria-label',t(drawerOpen?'closeMenu':'openMenu'));
    $('dialog-close').innerHTML=icon('close');
    $('dialog-close').setAttribute('aria-label',t('closeImage'));
    $('image-dialog').setAttribute('aria-label',t('infographic'));
    renderSidebar();renderHeader();renderMain();
    $('sidebar').inert=innerWidth<=760&&!drawerOpen;
    $('footer').innerHTML=`<div><strong>${t('footerTitle')}</strong><br>${t('footerText')}</div><div>${t('footerOriginal')}<br>${t('verified')}</div>`;
  }
  function toggleDrawer(open) {
    drawerOpen=open;
    $('sidebar').inert=innerWidth<=760&&!open;
    $('sidebar').classList.toggle('open',open);
    $('drawer-backdrop').hidden=!open;
    $('menu-toggle').setAttribute('aria-expanded',String(open));
    $('menu-toggle').setAttribute('aria-label',t(open?'closeMenu':'openMenu'));
    $('menu-toggle').innerHTML=icon(open?'close':'menu');
    document.body.classList.toggle('no-scroll',open);
    if(open) {document.querySelector('.workspace').inert=true;$('chapter-search').focus();}
    else {document.querySelector('.workspace').inert=false;}
  }
  function showImage() {
    const chapter=getRoute().chapter;if(!chapter)return;
    const i=variants.get(chapter.id)||0;
    $('dialog-image').src=chapter.images[i].src;
    $('dialog-image').alt=`${t('imageLabel')} ${chapter.id}: ${loc(chapter.title)}`;
    $('dialog-caption').textContent=`${t('chapter')} ${pad(chapter.id)} · ${loc(chapter.title)}${chapter.images.length>1?` · ${t('variant')} ${i+1}`:''}`;
    returnFocus=document.activeElement;
    $('image-dialog').showModal();
    document.body.classList.add('no-scroll');
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('#skip')){e.preventDefault();$('main').focus({preventScroll:true});$('main').scrollIntoView({block:'start'});return;}
    const languageButton=e.target.closest('[data-language]');
    if(languageButton){language=languageButton.dataset.language;try{localStorage.setItem('agents-cookbook-language',language);}catch{}renderAll();document.querySelector(`[data-language="${language}"]`).focus();return;}
    const filter=e.target.closest('[data-group]');
    if(filter){group=filter.dataset.group;renderHome();document.querySelector(`[data-group="${group}"]`).focus({preventScroll:true});return;}
    if(e.target.closest('[data-reset]')){query='';group='all';$('chapter-search').value='';renderNav();renderHome();return;}
    const scroll=e.target.closest('[data-scroll]');
    if(scroll){e.preventDefault();$(scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
    if(e.target.closest('[data-zoom]')){showImage();return;}
    const variant=e.target.closest('[data-variant]');
    if(variant){const c=getRoute().chapter;variants.set(c.id,Number(variant.dataset.variant));$('infographic').outerHTML=infographicPanel(c);document.querySelector(`[data-variant="${variant.dataset.variant}"]`).focus({preventScroll:true});return;}
    if(e.target.closest('#menu-toggle')){toggleDrawer(!drawerOpen);return;}
    if(e.target.closest('#drawer-backdrop')){toggleDrawer(false);$('menu-toggle').focus();return;}
    if(e.target.closest('#dialog-close')){$('image-dialog').close();return;}
    const link=e.target.closest('a[href^="#"]');
    if(link&&drawerOpen){toggleDrawer(false);$('main').focus({preventScroll:true});}
  });
  document.addEventListener('input',e=>{
    if(e.target.id!=='chapter-search')return;
    query=e.target.value;
    if(!getRoute().home){history.replaceState(null,'','#inicio');renderHeader();const home=document.querySelector('.home-link');home.classList.add('active');home.setAttribute('aria-current','page');}
    renderNav();renderMain();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&drawerOpen){toggleDrawer(false);$('menu-toggle').focus();}
    if(e.key==='Tab'&&drawerOpen){const targets=[$('menu-toggle'),...$('sidebar').querySelectorAll('a,button,input')].filter(el=>el.getClientRects().length);const first=targets[0],last=targets[targets.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  $('image-dialog').addEventListener('click',e=>{if(e.target===$('image-dialog'))$('image-dialog').close();});
  $('image-dialog').addEventListener('close',()=>{document.body.classList.remove('no-scroll');returnFocus?.focus({preventScroll:true});});
  window.addEventListener('hashchange',()=>{if(drawerOpen)toggleDrawer(false);renderAll();window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});});
  window.addEventListener('resize',()=>{if(innerWidth>760&&drawerOpen)toggleDrawer(false);$('sidebar').inert=innerWidth<=760&&!drawerOpen;});
  renderAll();
})();
</script>
</body>
</html>
