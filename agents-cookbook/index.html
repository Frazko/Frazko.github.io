  <script id="catalog" type="application/json">{"version":1,"reviewed":"2026-11-19","chapters":[{"id":1,"group":"foundations","title":{"es":"Anatomía de un agente","en":"Anatomy of an agent"},"kicker":{"es":"Las piezas esenciales","en":"The essential building blocks"},"intro":{"es":"Un agente combina un modelo de lenguaje, instrucciones, herramientas y un ciclo de ejecución para resolver una tarea. Puede decidir qué consultar, observar el resultado y ajustar el siguiente paso. Su utilidad depende de una meta clara, del acceso a información pertinente y de límites que la aplicación pueda hacer cumplir.","en":"An agent combines a language model, instructions, tools, and an execution loop to complete a task. It can decide what to inspect, observe the result, and adjust its next step. Its usefulness depends on a clear objective, access to relevant information, and limits that the surrounding application can enforce."},"explanation":{"es":"Piensa en el modelo como un componente que propone decisiones dentro de un sistema. El código conecta servicios, conserva el estado y controla la ejecución. Un flujo de pasos fijos puede ser suficiente cuando el procedimiento es conocido; la autonomía resulta útil cuando hace falta elegir entre distintos caminos.","en":"Think of the model as a component proposing decisions inside a larger system. Code connects services, stores state, and controls execution. A fixed workflow can be sufficient when the procedure is already known; autonomy becomes useful when a task requires choosing between different paths."},"concepts":[{"title":{"es":"Objetivo observable","en":"Observable objective"},"body":{"es":"Define cómo se reconoce una tarea terminada: una respuesta respaldada, un borrador listo o un registro actualizado y verificado.","en":"Define how completion is recognized: an evidence-backed answer, a finished draft, or an updated and verified record."}},{"title":{"es":"Ciclo de acción","en":"Action loop"},"body":{"es":"El agente interpreta, propone una acción, recibe su resultado y decide si continuar, pedir ayuda o terminar.","en":"The agent interprets, proposes an action, receives its result, and decides whether to continue, request help, or stop."}},{"title":{"es":"Límites del sistema","en":"System boundaries"},"body":{"es":"Tiempo, presupuesto, permisos y condiciones de parada pertenecen al diseño de la aplicación y deben ser explícitos.","en":"Time, budget, permissions, and stopping conditions belong to the application design and should be explicit."}}],"example":{"title":{"es":"Un asistente para preparar reuniones","en":"A meeting preparation assistant"},"body":{"es":"Un posible asistente consulta una agenda, recupera las notas autorizadas de reuniones anteriores y prepara una lista de temas. Si encuentra dos proyectos con el mismo nombre, solicita una aclaración. Termina al entregar el resumen con sus fuentes; enviar invitaciones sería una acción adicional con permisos propios.","en":"A possible assistant checks a calendar, retrieves authorized notes from earlier meetings, and prepares an agenda. If two projects share the same name, it requests clarification. It finishes by delivering a sourced summary; sending invitations would be a separate action with its own permissions."}},"takeaway":{"es":"Diseña primero la tarea y sus límites; después decide cuánta autonomía necesita.","en":"Design the task and its boundaries first, then decide how much autonomy it needs."},"videos":[{"url":"https://www.youtube.com/watch?v=F8NKVhkZZWI","title":"What are AI Agents?","channel":"IBM Technology","language":"EN","note":{"es":"Introducción visual a los agentes y a su relación con herramientas, datos externos y sistemas que combinan varias capacidades.","en":"A visual introduction to agents and their relationship with tools, external data, and systems that combine multiple capabilities."}},{"url":"https://www.youtube.com/watch?v=H3gH_Fe6xvs&t=3196s","title":"Aprende a Programar con Agentes de IA desde CERO (Curso Completo Gratis)","channel":"MoureDev by Brais Moure","language":"ES","note":{"es":"Desde 53:16: introducción práctica a agentes de programación; un ejemplo de aplicación para reconocer sus componentes y ciclo de trabajo.","en":"From 53:16: a practical introduction to coding agents, providing an application example of their components and working cycle."}}],"sources":[{"title":"Anthropic · Building effective agents","url":"https://www.anthropic.com/research/building-effective-agents"}],"images":[{"src":"assets/chapter-01-1.png","width":1024,"height":1536}]},{"id":2,"group":"foundations","title":{"es":"Tools: conectar el agente con el mundo","en":"Tools: connecting an agent to the world"},"kicker":{"es":"Acciones con contratos claros","en":"Actions with clear contracts"},"intro":{"es":"Las herramientas son funciones o servicios que permiten consultar datos y realizar acciones. El modelo propone una llamada con argumentos; la aplicación valida esa propuesta y ejecuta la operación permitida. Este mecanismo hace posible combinar lenguaje natural con buscadores, calendarios, bases de datos y otras funciones que ya existen en el software.","en":"Tools are functions or services that retrieve data and perform actions. The model proposes a call with arguments; the application validates the proposal and executes the permitted operation. This makes it possible to connect natural language with search, calendars, databases, and other capabilities already available in software."},"explanation":{"es":"Una herramienta bien diseñada explica cuándo usarla, qué entradas acepta y qué significa su resultado. Conviene separar consultas de operaciones que modifican datos. Los errores deben llegar como estados interpretables: una consulta fallida no demuestra que un registro no exista, y un timeout no confirma que una escritura haya fallado.","en":"A well-designed tool explains when to use it, which inputs it accepts, and what its result means. Separate queries from operations that change data. Errors should have interpretable states: a failed lookup does not prove that a record is missing, and a timeout does not confirm that a write failed."},"concepts":[{"title":{"es":"Entradas tipadas","en":"Typed inputs"},"body":{"es":"Usa campos concretos, valores permitidos y descripciones útiles; evita una herramienta ambigua que pueda ejecutar cualquier instrucción.","en":"Use concrete fields, allowed values, and useful descriptions; avoid an ambiguous tool that can execute any instruction."}},{"title":{"es":"Permisos en el servidor","en":"Server-side permissions"},"body":{"es":"La identidad autenticada y sus permisos se comprueban al ejecutar la acción, independientemente de lo que diga el modelo.","en":"Authenticated identity and permissions are checked when executing the action, independently of what the model says."}},{"title":{"es":"Resultados verificables","en":"Verifiable results"},"body":{"es":"Devuelve datos, estado y referencias que permitan distinguir entre éxito confirmado, ausencia de resultados y fallo de consulta.","en":"Return data, status, and references that distinguish confirmed success, no matching results, and a failed lookup."}}],"example":{"title":{"es":"Consultar y reservar una sala","en":"Checking and booking a room"},"body":{"es":"Un asistente de oficina podría usar una herramienta para consultar salas libres y otra para reservar una. Primero devuelve opciones compatibles con horario y capacidad. Cuando el usuario elige, la herramienta de reserva vuelve a comprobar disponibilidad y permisos. El asistente comunica la confirmación real recibida del sistema.","en":"An office assistant could use one tool to find available rooms and another to book a room. It first returns options matching the schedule and capacity. After the user chooses, the booking tool checks availability and permissions again. The assistant communicates the actual confirmation returned by the system."}},"takeaway":{"es":"Una propuesta de llamada solo se convierte en acción cuando tu aplicación la valida y ejecuta.","en":"A proposed call becomes an action only when your application validates and executes it."},"videos":[{"url":"https://www.youtube.com/watch?v=cjCYcTPryw8","title":"Build AI Function Calling with LangChain & Advanced AI Models","channel":"IBM Technology","language":"EN","note":{"es":"Demostración de llamadas a funciones para obtener datos externos; ayuda a entender el contrato entre el modelo y el código.","en":"Demonstrates function calling to retrieve external data, helping explain the contract between a language model and executable code."}},{"url":"https://www.youtube.com/watch?v=H3gH_Fe6xvs&t=6945s","title":"Aprende a Programar con Agentes de IA desde CERO (Curso Completo Gratis)","channel":"MoureDev by Brais Moure","language":"ES","note":{"es":"Desde 1:55:45: uso de MCP para conectar herramientas, dentro de un curso de agentes aplicado al desarrollo de software.","en":"From 1:55:45: using MCP to connect tools, within an agent course focused on software development workflows."}}],"sources":[{"title":"LangChain · Tools","url":"https://docs.langchain.com/oss/python/langchain/tools"}],"images":[{"src":"assets/chapter-02-1.png","width":1024,"height":1536}]},{"id":3,"group":"foundations","title":{"es":"Structured Outputs: de texto a datos","en":"Structured Outputs: from text to data"},"kicker":{"es":"Respuestas que el software puede usar","en":"Responses software can consume"},"intro":{"es":"Una respuesta estructurada convierte la salida del modelo en campos definidos: categoría, fecha, prioridad o elementos de una lista. Un esquema establece su forma y sus tipos. Esto facilita conectar la IA con formularios y procesos automáticos, pero un dato que cumple el esquema todavía necesita ser correcto y tener sentido para la tarea.","en":"A structured response turns model output into defined fields: category, date, priority, or items in a list. A schema establishes its shape and types. This makes AI easier to connect to forms and automated processes, but a schema-valid value still needs to be correct and meaningful for the task."},"explanation":{"es":"Diseña los campos a partir de lo que necesita el siguiente paso del sistema. Representa explícitamente la información desconocida y valida reglas que el esquema no cubre. Contempla respuestas incompletas o rechazos del modelo. Un formato estable reduce errores de integración; la verificación de hechos resuelve un problema diferente.","en":"Design fields around what the next system step needs. Explicitly represent unknown information and validate rules outside the schema. Handle incomplete responses and model refusals. A stable format reduces integration errors; checking factual accuracy addresses a different problem and remains necessary before acting on the values."},"concepts":[{"title":{"es":"Contrato de datos","en":"Data contract"},"body":{"es":"Define nombres, tipos y valores admitidos para que el código consumidor no tenga que interpretar variaciones de prosa.","en":"Define names, types, and allowed values so downstream code does not need to interpret variations in prose."}},{"title":{"es":"Desconocido explícito","en":"Explicit unknowns"},"body":{"es":"Un campo sin evidencia debe poder quedar vacío o marcado como desconocido, según el contrato, sin inventar contenido.","en":"A field lacking evidence should allow an empty or unknown state, according to the contract, without invented content."}},{"title":{"es":"Validación semántica","en":"Semantic validation"},"body":{"es":"Comprueba coherencia y reglas del dominio: una fecha bien formada puede estar fuera de plazo o corresponder al evento equivocado.","en":"Check consistency and domain rules: a correctly formatted date can be out of range or refer to the wrong event."}}],"example":{"title":{"es":"Clasificar una bandeja de entrada","en":"Classifying an inbox"},"body":{"es":"Un organizador de correo podría extraer asunto, categoría, fecha solicitada y necesidad de respuesta. Si el mensaje dice «el próximo viernes» sin contexto suficiente, conserva la expresión y pide resolver la fecha antes de crear un recordatorio. El objeto estructurado permite revisar los campos en una pantalla sencilla.","en":"An email organizer could extract a subject, category, requested date, and whether a reply is needed. If a message says “next Friday” without enough context, it preserves the expression and resolves the date before creating a reminder. A structured object makes each field easy to review in an interface."}},"takeaway":{"es":"La estructura garantiza un contrato de formato; la verdad requiere evidencia y validación.","en":"Structure provides a format contract; truth requires evidence and validation."},"videos":[{"url":"https://www.youtube.com/watch?v=kE4BkATIl9c","title":"OpenAI DevDay 2024 | Structured outputs for reliable applications","channel":"OpenAI","language":"EN","note":{"es":"Explica cómo utilizar esquemas JSON para obtener respuestas consistentes e integrarlas en aplicaciones que necesitan campos definidos.","en":"Explains how JSON schemas produce consistent responses and connect model output to applications that require clearly defined fields."}}],"sources":[{"title":"OpenAI · Structured model outputs","url":"https://developers.openai.com/api/docs/guides/structured-outputs"}],"images":[{"src":"assets/chapter-03-1.png","width":1024,"height":1536}]},{"id":4,"group":"foundations","title":{"es":"Guardrails: límites que se comprueban","en":"Guardrails: enforceable boundaries"},"kicker":{"es":"Protección en varias capas","en":"Protection across multiple layers"},"intro":{"es":"Los guardrails son controles que revisan entradas, propuestas de acción y resultados. Pueden detectar datos sensibles, rechazar argumentos inválidos o detener una operación fuera de política. Funcionan mejor como capas complementarias: reglas deterministas para condiciones precisas y evaluaciones adicionales cuando hace falta interpretar el significado de un texto.","en":"Guardrails are checks on inputs, proposed actions, and results. They can detect sensitive data, reject invalid arguments, or stop an operation outside policy. They work best as complementary layers: deterministic rules for precise conditions and additional assessments when interpreting the meaning of text is necessary."},"explanation":{"es":"Coloca cada control antes del efecto que intenta evitar. Revisar la respuesta final no impide que una herramienta haya modificado un registro minutos antes. Define también qué ocurre al bloquear una operación: corregir los argumentos, explicar la limitación o pedir revisión. Ningún filtro aislado sustituye los permisos del sistema.","en":"Place each check before the effect it is intended to prevent. Reviewing the final answer cannot prevent a tool from changing a record earlier. Define what happens when an operation is blocked: correct the arguments, explain the limitation, or request review. No standalone filter replaces system permissions."},"concepts":[{"title":{"es":"Entrada","en":"Input"},"body":{"es":"Distingue la solicitud del usuario del contenido externo que se está leyendo; ese contenido no recibe autoridad para cambiar las reglas.","en":"Distinguish the user request from external content being read; that content gains no authority to change the rules."}},{"title":{"es":"Acción","en":"Action"},"body":{"es":"Valida permisos, argumentos y límites justo antes de ejecutar herramientas capaces de escribir, enviar o modificar información.","en":"Validate permissions, arguments, and limits immediately before executing tools that can write, send, or modify information."}},{"title":{"es":"Salida","en":"Output"},"body":{"es":"Comprueba que la respuesta no exponga información restringida y que las afirmaciones importantes estén respaldadas por resultados disponibles.","en":"Check that the response exposes no restricted information and that important claims are supported by available results."}}],"example":{"title":{"es":"Resumir documentos compartidos","en":"Summarizing shared documents"},"body":{"es":"Un asistente documental podría leer archivos autorizados y preparar un resumen para un equipo. Un control excluye documentos sin permiso; otro detecta instrucciones maliciosas dentro del texto; una revisión de salida evita incluir información reservada. Si la selección de fuentes es insuficiente, el asistente informa qué material pudo consultar.","en":"A document assistant could read authorized files and prepare a team summary. One check excludes inaccessible documents; another detects malicious instructions inside their text; an output review avoids including restricted information. If the available sources are insufficient, the assistant explains which material it was able to inspect."}},"takeaway":{"es":"El control más útil se ejecuta antes de que ocurra la acción que quiere limitar.","en":"The most useful check runs before the action it is meant to constrain."},"videos":[{"url":"https://www.youtube.com/watch?v=M43nN___cl0","title":"Stop rogue AI: Enforce policy & cut costs in Agent Development Kit (ADK)","channel":"Google Cloud Tech","language":"EN","note":{"es":"Muestra controles mediante callbacks y límites de herramientas; permite observar cómo una política se convierte en comprobaciones ejecutables.","en":"Shows callback-based checks and tool restrictions, illustrating how a policy becomes executable checks within an agent workflow."}}],"sources":[{"title":"LangChain · Guardrails","url":"https://docs.langchain.com/oss/python/langchain/guardrails"}],"images":[{"src":"assets/chapter-04-1.png","width":1024,"height":1536}]},{"id":5,"group":"foundations","title":{"es":"Human-in-the-loop: aprobar y continuar","en":"Human-in-the-loop: approve and resume"},"kicker":{"es":"Supervisión en el momento adecuado","en":"Oversight at the right moment"},"intro":{"es":"La intervención humana permite que un agente prepare una acción y espere una decisión antes de ejecutarla. Es útil cuando el resultado afecta a otras personas, cambia información importante o requiere criterio contextual. La revisión debe mostrar una propuesta concreta: qué se hará, con qué datos y sobre qué recurso.","en":"Human intervention lets an agent prepare an action and wait for a decision before executing it. This is useful when the result affects other people, changes important information, or requires contextual judgment. A review should show a concrete proposal: what will happen, which data it uses, and which resource it affects."},"explanation":{"es":"Pausar requiere conservar el estado y asociar la decisión con la operación correcta. La persona puede aprobar, editar o rechazar, según el diseño. Al reanudar, verifica que la propuesta siga vigente y evita ejecutar dos veces la misma acción. Pedir aprobación para cada lectura rutinaria puede volver el proceso innecesariamente lento.","en":"Pausing requires preserving state and associating the decision with the correct operation. A person can approve, edit, or reject, depending on the design. On resumption, check that the proposal is still valid and avoid executing the same action twice. Requiring approval for every routine read can make a workflow needlessly slow."},"concepts":[{"title":{"es":"Propuesta revisable","en":"Reviewable proposal"},"body":{"es":"Presenta destinatarios, cambios y efectos esperados en lenguaje claro; una persona debe entender qué está autorizando antes de decidir.","en":"Show recipients, changes, and expected effects clearly; a person should understand what they are authorizing before deciding."}},{"title":{"es":"Estado persistente","en":"Persistent state"},"body":{"es":"Guarda la acción pendiente y su contexto para poder continuar aunque la sesión termine o el servidor se reinicie.","en":"Save the pending action and its context so the workflow can continue after a session ends or a server restarts."}},{"title":{"es":"Revalidación","en":"Revalidation"},"body":{"es":"Una aprobación antigua puede referirse a datos que cambiaron; comprueba vigencia, permisos y versión antes de ejecutar la acción.","en":"An older approval may refer to changed data; check validity, permissions, and version before executing the action."}}],"example":{"title":{"es":"Publicar una actualización de equipo","en":"Publishing a team update"},"body":{"es":"Un asistente podría preparar un resumen semanal con avances y enlaces. La persona revisa el texto y el canal de destino antes de publicarlo. Si edita el borrador, la aprobación se vincula a esa versión. El sistema conserva quién aprobó la publicación y confirma el identificador del mensaje realmente enviado.","en":"An assistant could prepare a weekly summary with progress and links. A person reviews the text and destination channel before publication. If they edit the draft, approval is tied to that version. The system records who approved publication and confirms the identifier of the message actually sent."}},"takeaway":{"es":"Una aprobación útil corresponde a una acción concreta, visible y vigente.","en":"Useful approval applies to a concrete, visible, and current action."},"videos":[{"url":"https://www.youtube.com/watch?v=IZabCqyBJLg","title":"Building Deep Agents and Deploying in Production","channel":"LangChain","language":"EN","note":{"es":"La sección desde 13:48 aborda interrupciones y aprobaciones humanas, dentro de una explicación más amplia de agentes en producción.","en":"The section from 13:48 covers interrupts and human approvals within a broader explanation of deploying agents in production."}}],"sources":[{"title":"LangChain · Human-in-the-loop","url":"https://docs.langchain.com/oss/python/langchain/human-in-the-loop"}],"images":[{"src":"assets/chapter-05-1.png","width":1024,"height":1536}]},{"id":6,"group":"foundations","title":{"es":"Sesiones y memoria","en":"Sessions and memory"},"kicker":{"es":"Continuidad con información útil","en":"Continuity through useful information"},"intro":{"es":"Una sesión conserva el contexto de una conversación para interpretar mensajes sucesivos. La memoria de largo plazo puede guardar preferencias o hechos útiles entre sesiones. Ambas necesitan límites claros: qué se recuerda, durante cuánto tiempo, quién puede verlo y cómo corregir o eliminar información que dejó de ser válida.","en":"A session preserves conversational context so successive messages can be interpreted. Long-term memory can retain preferences or useful facts across sessions. Both need clear boundaries: what is remembered, for how long, who can see it, and how to correct or delete information that is no longer valid."},"explanation":{"es":"El historial de mensajes y el estado de una operación cumplen funciones distintas. Recordar que alguien mencionó una reunión no prueba que esté confirmada en el calendario. Conserva las decisiones importantes en registros verificables y recupera solo la memoria pertinente para la tarea actual, respetando identidad y permisos.","en":"Message history and the state of an operation serve different purposes. Remembering that someone mentioned a meeting does not prove that it is confirmed on a calendar. Store important decisions in verifiable records and retrieve only memory relevant to the current task, respecting identity and permissions."},"concepts":[{"title":{"es":"Memoria de conversación","en":"Conversation memory"},"body":{"es":"Ayuda a resolver referencias como «esa reunión» o «el segundo documento» utilizando el intercambio reciente de la misma sesión.","en":"Helps resolve references such as “that meeting” or “the second document” using recent exchanges from the same session."}},{"title":{"es":"Preferencias duraderas","en":"Durable preferences"},"body":{"es":"Guarda únicamente preferencias útiles y consentidas, con mecanismos para actualizarlas; una preferencia no debe convertirse en una regla inamovible.","en":"Store only useful, consented preferences with ways to update them; a preference should not become an unchangeable rule."}},{"title":{"es":"Estado de la tarea","en":"Task state"},"body":{"es":"Mantén datos operativos como pendiente, confirmado o cancelado en una fuente fiable, separados de los recuerdos del diálogo.","en":"Keep operational states such as pending, confirmed, or canceled in a reliable source, separate from conversational memories."}}],"example":{"title":{"es":"Aprendizaje personalizado","en":"Personalized learning"},"body":{"es":"Un tutor de estudio podría recordar el tema de la sesión y, con permiso, el nivel y formato preferidos del estudiante. Los ejercicios terminados se guardan como registros comprobables. Al comenzar otro curso, recupera solo las preferencias pertinentes y permite corregirlas, sin trasladar automáticamente todo el historial anterior.","en":"A study tutor could remember the current topic and, with permission, the learner’s level and preferred format. Completed exercises are stored as verifiable records. When another course begins, it retrieves only relevant preferences and lets the learner correct them instead of carrying the entire previous history forward."}},"takeaway":{"es":"Recordar una conversación ayuda a interpretarla; confirmar una acción exige consultar su estado real.","en":"Remembering a conversation helps interpret it; confirming an action requires checking its actual state."},"videos":[{"url":"https://www.youtube.com/watch?v=tk6xI9Sjr3g","title":"How Do Agents Remember Anything Between Runs?","channel":"LangChain","language":"EN","note":{"es":"Distingue memoria de corto y largo plazo y muestra por qué la continuidad necesita información que persista entre ejecuciones.","en":"Distinguishes short-term and long-term memory and explains why continuity requires information that persists between separate agent runs."}}],"sources":[{"title":"LangChain · Short-term memory","url":"https://docs.langchain.com/oss/python/langchain/short-term-memory"}],"images":[{"src":"assets/chapter-06-1.png","width":1024,"height":1536}]},{"id":7,"group":"foundations","title":{"es":"Ingeniería de contexto y compactación","en":"Context engineering and compaction"},"kicker":{"es":"La información justa para decidir","en":"The right information for decisions"},"intro":{"es":"La ingeniería de contexto decide qué información recibe el modelo en cada paso: instrucciones, mensajes, documentos, resultados de herramientas y estado. Una ventana grande no elimina la necesidad de seleccionar. El objetivo es conservar evidencia y decisiones pertinentes, reducir ruido y evitar que datos obsoletos condicionen la siguiente acción.","en":"Context engineering determines what the model receives at each step: instructions, messages, documents, tool results, and state. A large context window does not eliminate the need to select. The goal is to preserve relevant evidence and decisions, reduce noise, and prevent outdated information from shaping the next action."},"explanation":{"es":"Recortar elimina elementos; resumir produce una versión abreviada; compactar reorganiza el contexto para continuar una tarea. Cada técnica puede perder detalles. Conserva fuera del resumen los hechos críticos y enlaces a las fuentes, y comprueba que restricciones, preguntas pendientes y decisiones confirmadas sobrevivan a la reducción.","en":"Trimming removes items; summarization produces a shorter account; compaction reorganizes context so a task can continue. Each technique can lose details. Preserve critical facts and source references outside the summary, and check that constraints, open questions, and confirmed decisions survive the reduction process."},"concepts":[{"title":{"es":"Seleccionar","en":"Select"},"body":{"es":"Recupera los documentos y resultados útiles para el paso actual, en lugar de añadir todo lo disponible a cada consulta.","en":"Retrieve documents and results useful to the current step instead of adding everything available to every model call."}},{"title":{"es":"Conservar invariantes","en":"Preserve invariants"},"body":{"es":"Presupuestos, permisos, fechas confirmadas y decisiones del usuario deben mantenerse fieles al original después de cualquier resumen.","en":"Budgets, permissions, confirmed dates, and user decisions must remain faithful to the original after any summarization."}},{"title":{"es":"Recuperar el detalle","en":"Recover detail"},"body":{"es":"Un resumen debe permitir volver a la evidencia completa cuando una decisión requiera información que quedó fuera del contexto.","en":"A summary should allow returning to the complete evidence when a decision requires information omitted from the current context."}}],"example":{"title":{"es":"Investigar un tema con muchos documentos","en":"Researching a topic across many documents"},"body":{"es":"Un asistente de investigación podría leer informes por lotes y guardar hallazgos con sus referencias. Para redactar una sección, recibe solo los hallazgos pertinentes y las restricciones editoriales. Si dos informes se contradicen, recupera ambos originales antes de concluir, en vez de tratar el resumen previo como una verdad definitiva.","en":"A research assistant could read reports in batches and store findings with references. To draft a section, it receives only relevant findings and editorial constraints. If two reports conflict, it retrieves both originals before reaching a conclusion instead of treating an earlier summary as definitive truth."}},"takeaway":{"es":"Reducir contexto es útil cuando conserva lo que la siguiente decisión necesita.","en":"Reducing context is useful when it preserves what the next decision needs."},"videos":[{"url":"https://www.youtube.com/watch?v=6_BcCthVvb8","title":"Context Engineering for AI Agents with LangChain and Manus","channel":"LangChain","language":"EN","note":{"es":"Conversación técnica sobre reducción, aislamiento y recuperación del contexto, con ejemplos de decisiones reales de diseño de agentes.","en":"A technical discussion of context reduction, isolation, and retrieval with examples of real decisions in agent architecture."}}],"sources":[{"title":"Anthropic · Effective context engineering","url":"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents"},{"title":"LangChain · Context engineering","url":"https://docs.langchain.com/oss/python/langchain/context-engineering"}],"images":[{"src":"assets/chapter-07-1.png","width":1024,"height":1536}]},{"id":8,"group":"foundations","title":{"es":"Tracing y observabilidad","en":"Tracing and observability"},"kicker":{"es":"Entender el recorrido completo","en":"Understand the complete execution path"},"intro":{"es":"Una traza permite reconstruir cómo una solicitud pasó por modelos, herramientas y servicios. Sus pasos muestran tiempos, entradas, salidas y errores según la instrumentación disponible. Esa información ayuda a explicar por qué una respuesta tardó, dónde faltaron datos o qué operación produjo un resultado inesperado durante la ejecución.","en":"A trace reconstructs how a request moved through models, tools, and services. Its steps show timings, inputs, outputs, and errors depending on the instrumentation available. This information helps explain why an answer was slow, where data was missing, or which operation produced an unexpected result during execution."},"explanation":{"es":"Relaciona los pasos con un identificador común y añade versiones de la configuración cuando sean relevantes. Observa también métricas agregadas para detectar tendencias. Registrar todas las conversaciones sin criterio no equivale a buena observabilidad: selecciona datos útiles, limita su conservación y protege el contenido sensible incluido en entradas o resultados.","en":"Connect steps using a common identifier and include relevant configuration versions. Also inspect aggregate metrics to detect trends. Indiscriminately recording every conversation is not the same as good observability: select useful data, limit retention, and protect sensitive content included in inputs or results."},"concepts":[{"title":{"es":"Trace y span","en":"Trace and span"},"body":{"es":"La traza reúne una operación completa; cada span representa una unidad de trabajo con su duración y contexto asociado.","en":"A trace groups a complete operation; each span represents a unit of work with its duration and associated context."}},{"title":{"es":"Causalidad","en":"Causality"},"body":{"es":"Relaciona llamadas y resultados para encontrar el primer fallo relevante, no solo el último mensaje de error que se muestra.","en":"Connect calls and results to locate the first relevant failure rather than only the final displayed error message."}},{"title":{"es":"Privacidad","en":"Privacy"},"body":{"es":"Evita registrar secretos o contenido innecesario; controla quién puede inspeccionar trazas y durante cuánto tiempo permanecen disponibles.","en":"Avoid recording secrets or unnecessary content; control who can inspect traces and how long they remain available."}}],"example":{"title":{"es":"Encontrar una búsqueda lenta","en":"Finding a slow search"},"body":{"es":"Un buscador documental podría tardar ocho segundos en responder. La traza muestra que la mayor parte del tiempo se consumió al consultar un repositorio, mientras la redacción fue rápida. El equipo puede mejorar esa integración y comparar nuevas trazas, sin atribuir automáticamente toda la demora al modelo de lenguaje.","en":"A document search assistant might take eight seconds to answer. Its trace reveals that most time was spent querying a repository while writing the answer was quick. The team can improve that integration and compare new traces instead of automatically blaming the language model for the entire delay."}},"takeaway":{"es":"Una respuesta final muestra el resultado; una traza permite investigar cómo se obtuvo.","en":"A final answer shows the result; a trace lets you investigate how it was produced."},"videos":[{"url":"https://www.youtube.com/watch?v=jLOM_ahG78c","title":"Trace Every Claude Code Session in LangSmith in Minutes","channel":"LangChain","language":"EN","note":{"es":"Ejemplo práctico de captura de mensajes, herramientas y subagentes; útil para visualizar trazas y seguir una conversación completa.","en":"A practical example of capturing messages, tools, and subagents, useful for visualizing traces and following a complete conversation."}}],"sources":[{"title":"OpenTelemetry · Traces","url":"https://opentelemetry.io/docs/concepts/signals/traces/"},{"title":"LangSmith · Observability concepts","url":"https://docs.langchain.com/langsmith/observability-concepts"}],"images":[{"src":"assets/chapter-08-1.png","width":1024,"height":1536}]},{"id":9,"group":"foundations","title":{"es":"Evals y pruebas de agentes","en":"Agent evaluations and tests"},"kicker":{"es":"Medir lo que significa hacerlo bien","en":"Measure what success means"},"intro":{"es":"Las evaluaciones convierten expectativas en criterios que se pueden comprobar. Un agente puede escribir una respuesta convincente y aun así usar la herramienta incorrecta, omitir una condición o ejecutar una acción indebida. Por eso conviene medir el resultado, los pasos relevantes y el cumplimiento de restricciones con casos representativos.","en":"Evaluations turn expectations into criteria that can be checked. An agent can write a convincing answer while using the wrong tool, missing a condition, or performing an inappropriate action. Measure the outcome, relevant intermediate steps, and adherence to constraints using representative cases rather than judging fluency alone."},"explanation":{"es":"Construye un conjunto de ejemplos habituales, ambiguos y difíciles, junto con resultados esperados o reglas de aceptación. Combina comprobaciones de código con revisión humana cuando corresponda. Repite la comparación al cambiar instrucciones, herramientas o modelos, usando las mismas condiciones para distinguir una mejora real de una variación circunstancial.","en":"Build a set of common, ambiguous, and difficult examples with expected outcomes or acceptance rules. Combine code-based checks with human review where appropriate. Repeat comparisons when instructions, tools, or models change, using the same conditions to distinguish a genuine improvement from a change caused by chance."},"concepts":[{"title":{"es":"Casos representativos","en":"Representative cases"},"body":{"es":"Incluye entradas incompletas, idiomas distintos y fallos de servicios, además de los ejemplos sencillos que ya sabes resolver.","en":"Include incomplete inputs, different languages, and service failures alongside the easy examples the system already handles well."}},{"title":{"es":"Criterios observables","en":"Observable criteria"},"body":{"es":"Define condiciones como citar una fuente válida, respetar un permiso o elegir una herramienta, con resultados que puedan revisarse.","en":"Define conditions such as citing a valid source, respecting a permission, or choosing a tool, with inspectable outcomes."}},{"title":{"es":"Regresiones","en":"Regressions"},"body":{"es":"Cada error corregido puede convertirse en un caso permanente para detectar si una modificación futura vuelve a introducirlo.","en":"Each corrected error can become a permanent test case to detect whether a future change introduces the problem again."}}],"example":{"title":{"es":"Evaluar un asistente de soporte","en":"Evaluating a support assistant"},"body":{"es":"Un equipo podría probar preguntas sobre una política de devoluciones con documentos controlados. Comprueba que el asistente cite el párrafo correcto, no prometa excepciones inexistentes y pida la fecha de compra cuando falta. Después compara una nueva configuración con la anterior usando exactamente los mismos casos.","en":"A team could test questions about a returns policy against controlled documents. It checks that the assistant cites the correct paragraph, avoids promising nonexistent exceptions, and requests a purchase date when it is missing. It then compares a new configuration with the old one using exactly the same cases."}},"takeaway":{"es":"Define el éxito antes de optimizar; una demostración convincente no sustituye una evaluación repetible.","en":"Define success before optimizing; a convincing demonstration does not replace a repeatable evaluation."},"videos":[{"url":"https://www.youtube.com/watch?v=pjv-mp5J4hA","title":"Catch Agent Regressions Before You Ship: Evals for Managed Deep Agents","channel":"LangChain","language":"EN","note":{"es":"Demostración de evaluaciones sobre citas, herramientas y regresiones, con ejemplos que distinguen una buena respuesta de una ejecución correcta.","en":"Demonstrates evaluations of citations, tools, and regressions, distinguishing a good-looking answer from a correctly executed task."}}],"sources":[{"title":"LangSmith · Evaluation concepts","url":"https://docs.langchain.com/langsmith/evaluation-concepts"}],"images":[{"src":"assets/chapter-09-1.png","width":1024,"height":1536}]},{"id":10,"group":"foundations","title":{"es":"Decidir bajo incertidumbre","en":"Making decisions under uncertainty"},"kicker":{"es":"Responder, verificar, preguntar o escalar","en":"Answer, verify, clarify, or escalate"},"intro":{"es":"Un agente debe distinguir entre información confirmada, inferencias y datos ausentes. La seguridad con que escribe no demuestra que tenga razón. Cuando falta evidencia, la decisión útil puede ser consultar otra fuente, formular una pregunta concreta o trasladar el caso a una persona, en lugar de completar detalles por su cuenta.","en":"An agent should distinguish confirmed information, inferences, and missing data. Confident wording does not prove correctness. When evidence is missing, the useful decision may be to consult another source, ask a focused question, or hand the case to a person instead of filling in details on its own."},"explanation":{"es":"Relaciona la decisión con el impacto del error y la calidad de la evidencia. Una puntuación de confianza solo ayuda si se ha calibrado y evaluado para ese uso. Define qué datos son indispensables, cómo resolver contradicciones y cuándo detener el flujo. La incertidumbre debe reflejarse también en el estado de la tarea.","en":"Connect each decision to the impact of an error and the quality of the evidence. A confidence score only helps if it has been calibrated and evaluated for that use. Define essential facts, how to resolve contradictions, and when to stop. Task state should also reflect unresolved uncertainty."},"concepts":[{"title":{"es":"Evidencia disponible","en":"Available evidence"},"body":{"es":"Identifica la fuente, su vigencia y su relación con la pregunta; una coincidencia de palabras no basta para confirmar una afirmación.","en":"Identify the source, freshness, and relevance to the question; a matching phrase alone does not confirm a claim."}},{"title":{"es":"Preguntas enfocadas","en":"Focused questions"},"body":{"es":"Pide el dato que cambiaría la decisión, con opciones claras cuando existan, y evita solicitar información que ya está confirmada.","en":"Ask for the fact that would change the decision, offer clear options when available, and avoid requesting already confirmed information."}},{"title":{"es":"Escalamiento","en":"Escalation"},"body":{"es":"Transfiere el caso con el contexto recopilado y la duda específica para que otra persona pueda continuar sin empezar de cero.","en":"Transfer the case with the collected context and the specific uncertainty so another person can continue without starting over."}}],"example":{"title":{"es":"Resolver una fecha ambigua","en":"Resolving an ambiguous date"},"body":{"es":"Un asistente de planificación recibe «muévelo para el viernes» cuando hay dos eventos abiertos. Antes de modificar nada, identifica qué evento sigue sin determinar y pregunta cuál debe cambiar. Si el horario está claro, no vuelve a pedirlo. La tarea permanece pendiente hasta obtener la aclaración necesaria.","en":"A planning assistant receives “move it to Friday” while two events are open. Before changing anything, it identifies the unresolved event and asks which one should move. If the time is already clear, it does not ask again. The task remains pending until the necessary clarification arrives."}},"takeaway":{"es":"La mejor respuesta puede ser una pregunta que evite una decisión equivocada.","en":"The best response can be a question that prevents the wrong decision."},"videos":[{"url":"https://www.youtube.com/watch?v=UWpNnpswc8Q","title":"Why Do AI Agents Hallucinate?","channel":"LangChain","language":"EN","note":{"es":"Introducción relacionada con las alucinaciones de agentes; ayuda a plantear por qué una afirmación necesita evidencia antes de actuar.","en":"An introduction to agent hallucinations that helps frame why a claim needs supporting evidence before it drives an action."}}],"sources":[{"title":"Anthropic · Reduce hallucinations","url":"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"}],"images":[{"src":"assets/chapter-10-1.png","width":1024,"height":1536}]},{"id":11,"group":"foundations","title":{"es":"Orquestación multiagente","en":"Multi-agent orchestration"},"kicker":{"es":"Coordinar responsabilidades","en":"Coordinating responsibilities"},"intro":{"es":"La orquestación multiagente reparte trabajo entre componentes con responsabilidades distintas. Un coordinador puede delegar tareas, integrar resultados y decidir el siguiente paso. También es posible transferir una conversación a un especialista. La separación aporta valor cuando reduce la complejidad de cada tarea o permite trabajar con contextos y herramientas diferentes.","en":"Multi-agent orchestration distributes work among components with different responsibilities. A coordinator can delegate tasks, integrate results, and choose the next step. A conversation can also be transferred to a specialist. Separation adds value when it reduces task complexity or supports work with different contexts and tools."},"explanation":{"es":"Cada interacción añade costo, latencia y posibilidades de perder información. Define entradas, salidas y criterios de finalización antes de añadir más agentes. Las tareas independientes pueden ejecutarse en paralelo; las que dependen de resultados previos necesitan orden. Un flujo determinista o un solo agente pueden ser más adecuados para procedimientos sencillos.","en":"Every interaction adds cost, latency, and opportunities to lose information. Define inputs, outputs, and completion criteria before adding more agents. Independent tasks can run concurrently; tasks depending on earlier results require ordering. A deterministic workflow or a single agent may better suit simple procedures."},"concepts":[{"title":{"es":"Coordinador y especialistas","en":"Coordinator and specialists"},"body":{"es":"Un componente conserva la responsabilidad del resultado, asigna tareas delimitadas y verifica que las respuestas recibidas satisfagan el contrato.","en":"One component remains responsible for the outcome, assigns bounded tasks, and checks that returned results satisfy the contract."}},{"title":{"es":"Handoffs","en":"Handoffs"},"body":{"es":"Una transferencia cambia quién atiende el siguiente tramo del trabajo; debe incluir el contexto necesario y respetar los permisos existentes.","en":"A handoff changes who handles the next stage; it should include necessary context and respect existing permissions."}},{"title":{"es":"Integración de resultados","en":"Result integration"},"body":{"es":"Combina resultados sin perder sus fuentes, identifica contradicciones y decide cómo resolverlas antes de entregar una conclusión conjunta.","en":"Combine results without losing their sources, identify contradictions, and decide how to resolve them before delivering a shared conclusion."}}],"example":{"title":{"es":"Preparar un informe de investigación","en":"Preparing a research report"},"body":{"es":"Un sistema podría asignar a dos especialistas la búsqueda de fuentes sobre aspectos independientes de un tema. Otro componente revisa referencias y un coordinador redacta el informe. Si los especialistas discrepan, el coordinador recupera la evidencia original. La división se justifica por el trabajo independiente, no por acumular agentes.","en":"A system could assign two specialists to find sources on independent aspects of a topic. Another component checks references, and a coordinator writes the report. If specialists disagree, the coordinator retrieves the original evidence. The division is justified by independent work rather than by increasing the number of agents."}},"takeaway":{"es":"Divide responsabilidades cuando mejore el trabajo; conserva un responsable claro del resultado.","en":"Split responsibilities when it improves the work, and keep clear ownership of the outcome."},"videos":[{"url":"https://www.youtube.com/watch?v=gUrENDkPw_k","title":"How to Build a Multi Agent AI System","channel":"IBM Technology","language":"EN","note":{"es":"Construcción de un equipo de agentes especializados; ofrece una demostración concreta de cómo repartir tareas y coordinar resultados.","en":"Builds a team of specialized agents, providing a concrete demonstration of dividing tasks and coordinating their resulting work."}},{"url":"https://www.youtube.com/watch?v=H3gH_Fe6xvs&t=10430s","title":"Aprende a Programar con Agentes de IA desde CERO (Curso Completo Gratis)","channel":"MoureDev by Brais Moure","language":"ES","note":{"es":"Desde 2:53:50: coordinación de multiagentes y subagentes en programación; una aplicación concreta de la división de responsabilidades.","en":"From 2:53:50: coordinating agents and subagents in programming, a concrete application of dividing responsibilities across a workflow."}}],"sources":[{"title":"LangChain · Multi-agent","url":"https://docs.langchain.com/oss/python/langchain/multi-agent"}],"images":[{"src":"assets/chapter-11-1.png","width":1024,"height":1536}]},{"id":13,"group":"systems","title":{"es":"Presupuestos y límites por ejecución","en":"Budgets and limits per run"},"kicker":{"es":"Uso responsable de recursos","en":"Resource control"},"intro":{"es":"Una petición sencilla puede desencadenar varias llamadas al modelo, búsquedas y reintentos. Por eso conviene definir cuánto puede consumir una tarea antes de iniciarla. Los límites de dinero, tiempo y pasos permiten que un asistente termine de forma previsible y explique qué quedó pendiente cuando necesita detenerse.","en":"A simple request can trigger several model calls, searches, and retries. Define how much a task may consume before starting it. Limits on money, time, and steps help an assistant finish predictably and explain what remains unfinished when it must stop. Resource control belongs in the application, alongside its other operating rules."},"explanation":{"es":"Diseña el presupuesto alrededor de la tarea completa. Antes de cada operación, revisa el saldo disponible y contempla su consumo máximo previsto. Después registra el uso real. Un límite de llamadas evita bucles, pero no equivale a un límite monetario: cada llamada puede tener un tamaño y un precio distintos.","en":"Design the budget around the complete task. Before each operation, check the available balance and account for its anticipated maximum consumption. Record actual usage afterward. A call limit prevents runaway loops, but it is not a monetary ceiling: individual calls may have different sizes and prices."},"concepts":[{"title":{"es":"Tres límites complementarios","en":"Three complementary limits"},"body":{"es":"Combina un máximo de pasos, un plazo y un presupuesto. Decide de antemano cuál es la respuesta cuando se alcanza cualquiera de ellos.","en":"Combine a step limit, a deadline, and a budget. Decide in advance what the application returns when it reaches any of them."}},{"title":{"es":"Reservar y conciliar","en":"Reserve and reconcile"},"body":{"es":"Cuando varias tareas comparten saldo, reserva capacidad antes de lanzarlas y actualiza el consumo al terminar. Así evitas gastar el mismo saldo varias veces.","en":"When concurrent tasks share a balance, reserve capacity before launching them and reconcile usage afterward. This prevents allocating the same remaining balance repeatedly."}},{"title":{"es":"Medir por resultado","en":"Measure by outcome"},"body":{"es":"Además de tokens, observa cuánto cuesta completar una tarea útil. Una respuesta barata que obliga a repetir todo puede resultar más costosa.","en":"Alongside tokens, measure the cost of completing a useful task. A cheap response that forces the entire process to repeat may cost more overall."}}],"example":{"title":{"es":"Un asistente que compara documentos","en":"An assistant comparing documents"},"body":{"es":"Imagina una herramienta que compara propuestas de proveedores. Puede leer los documentos, extraer criterios y realizar hasta tres búsquedas adicionales. Si el presupuesto restante no permite otra consulta, entrega la comparación parcial, señala los datos sin verificar y ofrece continuar más adelante con un presupuesto nuevo.","en":"Imagine a tool comparing supplier proposals. It can read documents, extract criteria, and make up to three additional searches. If the remaining budget cannot support another lookup, it delivers a partial comparison, identifies unverified details, and offers to continue later with a new budget. The stopping rule is visible rather than silently producing an incomplete answer."}},"takeaway":{"es":"Controla el consumo antes de cada paso y mide el coste de terminar bien la tarea.","en":"Control consumption before each step and measure the cost of completing the task well."},"videos":[{"url":"https://www.youtube.com/watch?v=nJEER0uaNkE","title":"Model Call Limit Middleware (Python)","channel":"LangChain","language":"EN","note":{"es":"Demuestra cómo limitar llamadas al modelo; una pieza concreta para impedir bucles y complementar un presupuesto por tarea.","en":"Demonstrates model call limits, a concrete control for preventing runaway loops alongside a task-level budget."}}],"sources":[{"title":"LangChain — Model call limit middleware","url":"https://docs.langchain.com/oss/python/langchain/middleware/built-in#model-call-limit"}],"images":[{"src":"assets/chapter-13-1.png","width":1024,"height":1536}]},{"id":14,"group":"systems","title":{"es":"Multi-tenancy y aislamiento","en":"Multi-tenancy and isolation"},"kicker":{"es":"Datos separados, plataforma compartida","en":"Shared platform, isolated data"},"intro":{"es":"Una plataforma puede atender a muchas organizaciones usando infraestructura compartida. Cada organización es un tenant y necesita una frontera clara alrededor de sus documentos, usuarios y operaciones. Cuando añades un agente, esa frontera también debe proteger sus búsquedas, herramientas, memoria y resultados, incluso si el usuario escribe instrucciones que intentan cruzarla.","en":"A platform can serve many organizations on shared infrastructure. Each organization is a tenant and needs a clear boundary around its documents, users, and operations. When an agent is added, that boundary must also protect its searches, tools, memory, and results, even when a user writes instructions that try to cross it."},"explanation":{"es":"Trata la identidad y los permisos como datos verificados por el servidor. El modelo puede proponer una consulta, pero la aplicación determina qué organización y recursos puede consultar. Revisa también las capas menos visibles: claves de caché, archivos temporales, trazas y conversaciones pueden mezclar información si no incluyen el ámbito correcto.","en":"Treat identity and permissions as server-verified data. The model may propose a query, while the application determines which organization and resources it can access. Review less visible layers too: cache keys, temporary files, traces, and conversations can mix information if they do not include the right scope."},"concepts":[{"title":{"es":"Identidad confiable","en":"Trusted identity"},"body":{"es":"Obtén la organización desde la sesión autenticada y verifica la pertenencia del usuario. Una organización escrita dentro del mensaje no concede acceso.","en":"Derive the organization from the authenticated session and verify user membership. An organization name written in a message does not grant access to it."}},{"title":{"es":"Permisos en cada acceso","en":"Permissions on every access"},"body":{"es":"Aplica la autorización cuando buscas, lees y modificas recursos. Filtrar únicamente la respuesta final permite que información ajena ya haya entrado al contexto.","en":"Apply authorization when searching, reading, and changing resources. Filtering only the final response can allow another organization’s information into the model context first."}},{"title":{"es":"Pruebas entre organizaciones","en":"Cross-organization tests"},"body":{"es":"Crea casos que intenten consultar recursos de otra organización mediante IDs, búsquedas y enlaces. Incluye también cachés y tareas ejecutadas en segundo plano.","en":"Test attempts to access another organization’s resources through IDs, search, and links. Include caches and background tasks, where scope mistakes can be less obvious."}}],"example":{"title":{"es":"Documentación para varias empresas","en":"Documentation for multiple companies"},"body":{"es":"Un servicio de soporte aloja los manuales de varias empresas. Dos clientes preguntan por un documento con el mismo título. El asistente busca solo en el espacio autorizado para cada cliente, conserva memorias separadas y comprueba el permiso otra vez antes de abrir un archivo o registrar una incidencia.","en":"A support service hosts manuals for several companies. Two customers ask about a document with the same title. The assistant searches only the space authorized for each customer, keeps separate memories, and checks permission again before opening a file or creating a ticket. Identical wording never implies identical access rights."}},"takeaway":{"es":"El aislamiento se impone en la aplicación y sus datos, no mediante una promesa en el prompt.","en":"Enforce isolation in the application and its data, not through a promise in the prompt."},"videos":[{"url":"https://www.youtube.com/watch?v=7MRugm27CJo","title":"Tenant Isolation & Data Partitioning","channel":"AWS Partner Network","language":"EN","note":{"es":"Explica las decisiones de aislamiento y partición de datos que necesitas antes de añadir agentes a una plataforma compartida.","en":"Explains isolation and data-partitioning decisions to consider before adding agents to a shared platform."}}],"sources":[{"title":"AWS — SaaS Tenant Isolation Strategies","url":"https://docs.aws.amazon.com/whitepapers/latest/saas-tenant-isolation-strategies/saas-tenant-isolation-strategies.html"}],"images":[{"src":"assets/chapter-14-1.png","width":1024,"height":1536}]},{"id":15,"group":"systems","title":{"es":"Integraciones resistentes a fallos","en":"Resilient integrations"},"kicker":{"es":"APIs, ERP y servicios externos","en":"APIs, ERP, and external services"},"intro":{"es":"Un agente depende a menudo de servicios externos: calendarios, tiendas, sistemas administrativos o bases de datos. Esos servicios pueden tardar demasiado, fallar o responder después de que la aplicación haya dejado de esperar. Una integración robusta distingue estos casos y evita convertir la ausencia de respuesta en un dato inventado.","en":"An agent often depends on external services: calendars, stores, administrative systems, or databases. Those services may respond slowly, fail, or complete a request after the application has stopped waiting. A robust integration distinguishes these situations and prevents a missing response from becoming an invented fact or an unsafe repeated operation."},"explanation":{"es":"Define un tiempo de espera y clasifica los errores antes de reintentar. Una lectura puede repetirse en muchos escenarios; una operación que crea o cobra algo necesita más cuidado. Si no sabes si una escritura terminó, consulta su estado con un identificador estable antes de volver a ejecutarla.","en":"Set a timeout and classify errors before retrying. A read can often be repeated; an operation that creates or charges something needs more care. If a write might have completed, check its status using a stable identifier before executing it again. Distinguish failure to observe a result from failure of the operation itself."},"concepts":[{"title":{"es":"Espera limitada","en":"Bounded waiting"},"body":{"es":"Establece plazos para las llamadas y para la tarea completa. Si la dependencia no responde, informa de la incertidumbre y conserva el estado necesario.","en":"Set deadlines for calls and for the complete task. If a dependency does not respond, report uncertainty and preserve the state needed for recovery."}},{"title":{"es":"Reintentos selectivos","en":"Selective retries"},"body":{"es":"Reintenta errores transitorios con pausas y un máximo de intentos. Los errores de permisos o datos inválidos requieren corrección, no repetir indefinidamente.","en":"Retry transient errors with delays and a maximum attempt count. Permission errors or invalid data require correction rather than indefinite repetition of the same request."}},{"title":{"es":"Circuit breaker","en":"Circuit breaker"},"body":{"es":"Suspende temporalmente llamadas a una dependencia que falla repetidamente. Realiza pruebas controladas para comprobar su recuperación y evita saturar un servicio ya degradado.","en":"Temporarily stop calls to a repeatedly failing dependency. Use controlled probes to detect recovery and avoid overloading a service that is already struggling."}}],"example":{"title":{"es":"Crear una reserva sin duplicarla","en":"Creating a booking without duplicates"},"body":{"es":"Un asistente solicita una reserva de una sala y la conexión se interrumpe. En lugar de crear otra inmediatamente, consulta la operación original. Si sigue sin poder verificarla, muestra “confirmación pendiente”. Mientras tanto, puede continuar preparando el resumen de la reunión, que no depende de que la reserva esté confirmada.","en":"An assistant requests a room booking and the connection breaks. Instead of immediately creating another, it checks the original operation. If confirmation remains unavailable, it displays “confirmation pending.” Meanwhile, it can prepare the meeting summary, which does not depend on a confirmed reservation. This preserves useful progress without multiplying uncertain actions."}},"takeaway":{"es":"Una respuesta ausente indica incertidumbre; no demuestra que la operación haya fallado.","en":"A missing response indicates uncertainty; it does not prove that the operation failed."},"videos":[{"url":"https://www.youtube.com/watch?v=NB3ei9pnHFA","title":"AWS Summit ANZ 2022 - Build resilient microservices using fault-tolerant patterns (DEV5)","channel":"AWS Events","language":"EN","note":{"es":"Presenta patrones de tolerancia a fallos y recuperación útiles para herramientas de agentes que llaman a servicios externos.","en":"Presents fault-tolerance and recovery patterns useful for agent tools that call external services."}}],"sources":[{"title":"AWS — Timeouts, retries, and backoff with jitter","url":"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"},{"title":"AWS — Circuit breaker pattern","url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html"}],"images":[{"src":"assets/chapter-15-1.png","width":1024,"height":1536},{"src":"assets/chapter-15-2.png","width":1024,"height":1536}]},{"id":16,"group":"systems","title":{"es":"Sincronización de datos y eventos","en":"Data synchronization and events"},"kicker":{"es":"Información que se mantiene actualizada","en":"Keeping information current"},"intro":{"es":"El agente suele consultar una copia de información que cambia en otro sistema. Entre una actualización y su llegada al buscador puede existir un retraso. Entender esa separación ayuda a diseñar respuestas honestas y a decidir cuándo basta con una copia rápida y cuándo debes consultar la fuente principal.","en":"An agent often queries a copy of information that changes in another system. There can be a delay between an update and its arrival in the search index. Understanding that separation helps you design honest responses and decide when a fast copy is sufficient and when the authoritative source must be consulted."},"explanation":{"es":"Puedes sincronizar mediante consultas periódicas, webhooks o captura de cambios de una base de datos. Cada opción tiene costes y garantías diferentes. Guarda la versión y el momento del dato, procesa duplicados de forma segura y contempla que los eventos puedan llegar tarde o en un orden distinto al esperado.","en":"You can synchronize through periodic polling, webhooks, or database change data capture. Each option has different costs and guarantees. Store data versions and timestamps, process duplicates safely, and account for events that arrive late or out of the expected order. A fast event stream still needs consistency checks."},"concepts":[{"title":{"es":"Fuente de verdad","en":"Source of truth"},"body":{"es":"Define qué sistema decide el valor vigente de cada dato. Una copia destinada a búsquedas no debería convertirse accidentalmente en la autoridad para confirmar operaciones.","en":"Define which system determines the current value of each field. A search-oriented copy should not accidentally become the authority used to confirm operations."}},{"title":{"es":"Frescura visible","en":"Visible freshness"},"body":{"es":"Conserva cuándo se obtuvo o verificó la información. La tolerancia al retraso depende del uso: un manual cambia distinto que la disponibilidad de una sala.","en":"Record when information was obtained or verified. Acceptable delay depends on the use case: documentation changes differently from the current availability of a meeting room."}},{"title":{"es":"Eventos repetidos o tardíos","en":"Repeated or delayed events"},"body":{"es":"Usa identificadores y versiones para reconocer duplicados y actualizaciones antiguas. Diseña también una reconciliación periódica que detecte diferencias entre la fuente y sus copias.","en":"Use identifiers and versions to recognize duplicates and outdated updates. Add periodic reconciliation to detect differences between the source system and its downstream copies."}}],"example":{"title":{"es":"Un buscador de actividades","en":"An activity search assistant"},"body":{"es":"Una app de ocio puede indexar actividades para encontrarlas rápidamente por tema y ubicación. Las cancelaciones llegan mediante eventos. Antes de confirmar una inscripción, consulta de nuevo el servicio de reservas. Si el índice todavía muestra una actividad cancelada, la verificación final impide prometer una plaza que ya no existe.","en":"A leisure app can index activities for quick searches by topic and location. Cancellation updates arrive as events. Before confirming registration, it checks the booking service again. If the index still contains a cancelled activity, final verification prevents promising a place that no longer exists, while keeping discovery fast and responsive."}},"takeaway":{"es":"Usa copias para encontrar opciones y verifica en la fuente cuando la decisión requiere datos actuales.","en":"Use copies to discover options and verify the source when a decision requires current data."},"videos":[{"url":"https://www.youtube.com/watch?v=ie9JnR9GASI","title":"Demo: Apache Flink®️ Change Data Capture (CDC) | Confluent Cloud","channel":"Confluent, an IBM Company","language":"EN","note":{"es":"Muestra cambios de base de datos viajando por una canalización, con ejemplos de sincronización y evolución del esquema.","en":"Shows database changes moving through a pipeline, with examples of synchronization and schema evolution."}}],"sources":[{"title":"Debezium — Architecture","url":"https://debezium.io/documentation/reference/stable/architecture.html"}],"images":[{"src":"assets/chapter-16-1.png","width":1024,"height":1536}]},{"id":17,"group":"retrieval","title":{"es":"Búsqueda híbrida y RAG","en":"Hybrid search and RAG"},"kicker":{"es":"Encontrar evidencia relevante","en":"Finding relevant evidence"},"intro":{"es":"Las personas describen lo que buscan con palabras distintas a las del documento. La búsqueda semántica ayuda con ese problema, mientras que la búsqueda por términos conserva señales como nombres, códigos y expresiones exactas. La búsqueda híbrida combina ambas para reunir candidatos que después pueden alimentar una respuesta respaldada por fuentes.","en":"People describe what they need using different words from those in a document. Semantic search helps with that mismatch, while keyword search preserves signals such as names, codes, and exact expressions. Hybrid search combines both approaches to gather candidates that can then support an answer grounded in source material."},"explanation":{"es":"RAG separa la recuperación de información de la redacción de la respuesta. Primero selecciona documentos accesibles y pertinentes; después ofrece sus fragmentos al modelo. La similitud ayuda a encontrar material, pero no demuestra que sea correcto, reciente o autorizado. Esas comprobaciones necesitan reglas y metadatos adicionales.","en":"RAG separates information retrieval from response generation. First select accessible, relevant documents; then provide their passages to the model. Similarity helps locate material, but does not establish that it is correct, current, or authorized. Those checks need additional rules and metadata, as well as a clear connection between claims and evidence."},"concepts":[{"title":{"es":"Palabras y significado","en":"Words and meaning"},"body":{"es":"Una consulta exacta favorece nombres y códigos. Una consulta semántica encuentra formulaciones equivalentes. Compara su combinación con ejemplos reales de tu colección.","en":"Exact-term search favors names and codes. Semantic search finds related formulations. Compare their combination using real queries and documents from your own collection."}},{"title":{"es":"Filtros obligatorios","en":"Required filters"},"body":{"es":"Aplica permisos, idioma, fechas o categorías cuando sean condiciones necesarias. Un documento muy parecido sigue siendo incorrecto si pertenece a otro ámbito.","en":"Apply permissions, language, dates, or categories when they are required conditions. A highly similar document can still be unsuitable when it belongs to another scope."}},{"title":{"es":"Respuesta con evidencia","en":"Evidence-backed response"},"body":{"es":"Selecciona fragmentos suficientes para contestar y conserva sus referencias. Si falta información, indica el límite en lugar de completar una explicación con suposiciones.","en":"Select enough passages to answer and retain their references. When information is missing, state the limitation instead of completing the explanation with unsupported assumptions."}}],"example":{"title":{"es":"Encontrar una política interna","en":"Finding an internal policy"},"body":{"es":"Una persona busca “cómo recuperar gastos de tren”. El manual utiliza “reembolso de transporte ferroviario”. La parte semántica conecta ambas expresiones; la parte lexical encuentra números de formulario o nombres exactos. Un filtro selecciona la política vigente y el asistente responde con el procedimiento y un enlace al documento.","en":"A person searches for “getting train expenses back.” The manual uses “rail travel reimbursement.” Semantic search connects the expressions; lexical search finds exact form numbers or names. A filter selects the current policy, and the assistant returns the procedure with a document link. The same approach can support product catalogs or educational libraries."}},"takeaway":{"es":"Recuperar contenido parecido es el comienzo; responder requiere evidencia adecuada y permisos correctos.","en":"Retrieving similar content is the beginning; answering requires suitable evidence and correct permissions."},"videos":[{"url":"https://www.youtube.com/watch?v=pHB-m-ZITw4","title":"The Weaviate Vector Database — Bring AI-native applications to life.","channel":"CMU Database Group","language":"EN","note":{"es":"El cofundador de Weaviate explica búsqueda vectorial e híbrida en una clase sobre bases de datos.","en":"Weaviate’s co-founder explains vector and hybrid search in a database systems lecture."}}],"sources":[{"title":"Weaviate — Hybrid search","url":"https://docs.weaviate.io/weaviate/concepts/search/hybrid-search"}],"images":[{"src":"assets/chapter-17-1.png","width":1024,"height":1536}]},{"id":18,"group":"retrieval","title":{"es":"Evaluar recuperación y ranking","en":"Evaluating retrieval and ranking"},"kicker":{"es":"Medir antes de ajustar","en":"Measure before tuning"},"intro":{"es":"Un buscador puede parecer convincente y aun así omitir el documento necesario. Evaluar la recuperación significa comprobar, con consultas representativas, si aparecen los resultados correctos y en qué posición. Esta medición permite comparar cambios sin depender de una demostración afortunada o de la impresión que produce una respuesta bien escrita.","en":"A search system can look convincing while missing the document needed to answer. Retrieval evaluation checks representative queries to see whether the right results appear and where they rank. It lets you compare changes without relying on a lucky demonstration or the impression created by a well-written generated response."},"explanation":{"es":"Construye un conjunto de preguntas con documentos relevantes identificados. Reserva casos para validar cambios y evita ajustar todo al mismo pequeño grupo de ejemplos. Evalúa por separado encontrar la evidencia y usarla correctamente: un modelo puede redactar mal con buenos documentos, o redactar con fluidez después de recuperar material irrelevante.","en":"Build a set of questions with identified relevant documents. Reserve cases for validation and avoid tuning everything to the same small set of examples. Evaluate finding evidence separately from using it correctly: a model may write poorly from good documents, or write fluently after retrieving irrelevant material."},"concepts":[{"title":{"es":"Recall@k","en":"Recall@k"},"body":{"es":"Pregunta qué proporción de los documentos relevantes aparece entre los primeros k resultados. Es útil cuando perder una fuente necesaria deja la respuesta incompleta.","en":"Ask what proportion of relevant documents appears among the first k results. This matters when missing a necessary source makes the final answer incomplete."}},{"title":{"es":"Precision@k","en":"Precision@k"},"body":{"es":"Mide qué parte de los primeros k resultados es relevante. Ayuda a detectar ruido que consume contexto y distrae al modelo al redactar.","en":"Measure how many of the first k results are relevant. This helps identify noise that consumes context and distracts the model during answer generation."}},{"title":{"es":"Posición y segmentos","en":"Position and segments"},"body":{"es":"MRR y nDCG valoran el orden de los resultados. Revisa también los fallos por idioma, tema y tipo de consulta para no esconderlos detrás del promedio.","en":"MRR and nDCG capture result ordering. Also examine failures by language, topic, and query type so that aggregate averages do not conceal important weaknesses."}}],"example":{"title":{"es":"Comparar dos buscadores de ayuda","en":"Comparing two help search systems"},"body":{"es":"Un equipo prepara preguntas frecuentes, preguntas ambiguas y casos sin respuesta disponible. Compara una búsqueda lexical con una versión híbrida usando las mismas referencias. Si mejora el promedio pero empeoran las consultas de códigos exactos, ajusta esa ruta antes de desplegar el cambio para toda la base de ayuda.","en":"A team prepares common questions, ambiguous requests, and cases with no available answer. It compares lexical and hybrid search against the same reference documents. If the average improves but exact-code queries become worse, the team adjusts that path before releasing the change across the whole help center. Segment results guide the next experiment."}},"takeaway":{"es":"Mide si encuentras la evidencia correcta antes de evaluar lo bien que suena la respuesta.","en":"Measure whether you find the right evidence before evaluating how convincing the answer sounds."},"videos":[{"url":"https://www.youtube.com/watch?v=44h94AJgQoM","title":"LlamaIndex Sessions: Evaluating RAG with LlamaIndex (McDermott)","channel":"LlamaIndex","language":"EN","note":{"es":"Presenta un caso real de evaluación de RAG y sus desafíos; complementa las métricas de recuperación con la evaluación final.","en":"Presents a real RAG evaluation project and its challenges, connecting retrieval measurements with end-to-end quality assessment."}}],"sources":[{"title":"Sentence Transformers — Information retrieval evaluation","url":"https://www.sbert.net/docs/package_reference/sentence_transformer/evaluation.html#informationretrievalevaluator"}],"images":[{"src":"assets/chapter-18-1.png","width":1024,"height":1536}]},{"id":19,"group":"retrieval","title":{"es":"Reranking: ordenar mejores resultados","en":"Reranking: ordering better results"},"kicker":{"es":"Una segunda mirada a los candidatos","en":"A second look at candidates"},"intro":{"es":"La primera búsqueda busca rapidez y cobertura; no siempre produce el mejor orden. El reranking toma un conjunto reducido de candidatos y los vuelve a valorar respecto a la pregunta. Así puedes dedicar un análisis más cuidadoso a unos pocos documentos antes de elegir los que llegarán al usuario o al modelo.","en":"The first search prioritizes speed and coverage; it does not always produce the best ordering. Reranking takes a smaller set of candidates and evaluates them again against the question. This lets you spend more effort on a limited set of documents before choosing what reaches the user or the model."},"explanation":{"es":"Una segunda etapa puede usar un modelo que examine conjuntamente la pregunta y cada candidato. El resultado es una nueva clasificación, no una certificación de verdad. Mantén los filtros de acceso y las restricciones del dominio; además, comprueba cuánto mejora la relevancia frente al tiempo y coste que añade.","en":"A second stage can use a model that examines the question and each candidate together. Its output is a new ranking, not a certificate of truth. Preserve access filters and domain constraints, then measure how much relevance improves against the additional latency and cost introduced by this stage."},"concepts":[{"title":{"es":"Cobertura primero","en":"Coverage first"},"body":{"es":"El reranker solo puede ordenar los candidatos recibidos. Si el documento correcto nunca entró en ese conjunto, necesitas mejorar también la recuperación inicial.","en":"A reranker can only order the candidates it receives. If the right document never entered that set, you must also improve the initial retrieval stage."}},{"title":{"es":"Relevancia contextual","en":"Contextual relevance"},"body":{"es":"La segunda evaluación considera la relación entre consulta y documento. Una palabra compartida no basta si el contenido responde a otra pregunta o intención.","en":"The second evaluation considers the relationship between the query and document. Shared words are insufficient when the content answers a different question or intention."}},{"title":{"es":"Coste frente a mejora","en":"Cost versus improvement"},"body":{"es":"Ajusta cuántos candidatos revisas y cuántos conservas. Evalúa relevancia y latencia juntas; una mejora pequeña puede no justificar una espera considerable.","en":"Tune how many candidates you review and retain. Evaluate relevance and latency together: a small improvement may not justify a substantial increase in waiting time."}}],"example":{"title":{"es":"Buscar el manual adecuado","en":"Finding the right manual"},"body":{"es":"Una biblioteca técnica contiene instrucciones de instalación, notas de versiones y preguntas frecuentes. La búsqueda recupera treinta documentos sobre un error. El reranker favorece los que explican ese error en el sistema operativo solicitado; después, la aplicación conserva las fuentes más útiles y muestra su versión para evitar mezclar instrucciones incompatibles.","en":"A technical library contains installation guides, release notes, and FAQs. Search retrieves thirty documents about an error. A reranker favors those explaining that error on the requested operating system. The application then retains the most useful sources and displays their versions, helping users avoid mixing incompatible instructions from otherwise similar documents."}},"takeaway":{"es":"Reordena para mejorar relevancia, pero conserva las reglas y comprueba que la evidencia estaba entre los candidatos.","en":"Rerank for relevance, while preserving constraints and checking that the evidence was among the candidates."},"videos":[{"url":"https://www.youtube.com/watch?v=H6kCi7esgw0","title":"Getting Started with Pinecone","channel":"Pinecone","language":"EN","note":{"es":"Recorre un flujo de búsqueda que incluye reordenar resultados; permite ubicar el reranking dentro de una implementación completa.","en":"Walks through a search workflow including reranking, showing where the second ranking stage fits into an implementation."}}],"sources":[{"title":"Sentence Transformers — Retrieve & Re-Rank","url":"https://www.sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html"}],"images":[{"src":"assets/chapter-19-1.png","width":1024,"height":1536}]},{"id":20,"group":"retrieval","title":{"es":"Reescritura de consultas y expansión","en":"Query rewriting and expansion"},"kicker":{"es":"Buscar mejor sin cambiar la intención","en":"Better search, same intent"},"intro":{"es":"La pregunta que una persona escribe no siempre es la mejor consulta para un buscador. Puede contener abreviaturas, referencias a mensajes previos o vocabulario informal. Reescribir ayuda a expresar la misma necesidad con mayor claridad; expandir añ
