ade variantes controladas para encontrar documentos que utilizan otros términos sin cambiar lo solicitado.","en":"The question a person writes is not always the best query for a search engine. It may contain abbreviations, references to earlier messages, or informal wording. Rewriting expresses the same need more clearly; expansion adds controlled variants to find documents using different terminology without changing what the person requested."},"explanation":{"es":"Conserva la consulta original y los datos confirmados. Genera variantes útiles, busca con ellas y combina resultados sin duplicarlos. No rellenes restricciones desconocidas para hacer la consulta más específica. Si una decisión depende de un dato ausente, pide una aclaración en lugar de convertir una suposición en un filtro obligatorio.","en":"Keep the original query and confirmed facts. Generate useful variants, search with them, and combine results without duplicates. Do not fill in unknown constraints merely to make a query more specific. If a decision depends on missing information, ask for clarification instead of turning an assumption into a required filter."},"concepts":[{"title":{"es":"Normalizar","en":"Normalize"},"body":{"es":"Desarrolla abreviaturas y uniforma expresiones cuando la equivalencia sea clara. Mantén intactos nombres, fechas y códigos cuya modificación alteraría la búsqueda.","en":"Expand abbreviations and standardize expressions when equivalence is clear. Preserve names, dates, and codes when modifying them would change what the search means."}},{"title":{"es":"Variantes acotadas","en":"Bounded variants"},"body":{"es":"Añade pocas reformulaciones pertinentes y mide si mejoran resultados. Más consultas también significan más coste, más latencia y más candidatos que revisar.","en":"Add a few relevant reformulations and measure whether results improve. More queries also mean more cost, more latency, and more candidates to review."}},{"title":{"es":"Trazabilidad de la intención","en":"Intent traceability"},"body":{"es":"Guarda qué consulta produjo cada candidato y compara las reformulaciones con la petición original. Así puedes detectar cuándo la búsqueda se desvió del objetivo.","en":"Record which query produced each candidate and compare reformulations with the original request. This makes it easier to identify when search drifted away from its goal."}}],"example":{"title":{"es":"Encontrar instrucciones con otro vocabulario","en":"Finding instructions under different wording"},"body":{"es":"Una persona pregunta “¿cómo deshago lo que subí ayer?”. El asistente sabe por el turno anterior que habla de archivos, pero no conoce cuál. Puede buscar “restaurar versión anterior” y “revertir carga de archivos”. Antes de cambiar un archivo concreto, pregunta cuál y confirma la operación requerida.","en":"A person asks, “How do I undo what I uploaded yesterday?” Earlier context establishes that they mean files, but not which file. The assistant can search for “restore previous version” and “revert file upload.” Before changing a specific file, it asks which one and confirms the requested operation rather than guessing."}},"takeaway":{"es":"Reformula el lenguaje, no los hechos ni las restricciones de la persona.","en":"Reformulate the wording, not the person’s facts or constraints."},"videos":[{"url":"https://www.youtube.com/watch?v=JChPi0CRnDY","title":"RAG from scratch: Part 5 (Query Translation -- Multi Query)","channel":"LangChain","language":"EN","note":{"es":"Explica cómo generar varias consultas de una misma pregunta y reunir los documentos obtenidos desde distintas formulaciones.","en":"Explains generating multiple queries from one question and combining documents retrieved through different formulations."}}],"sources":[{"title":"Ma et al. — Query Rewriting for Retrieval-Augmented Large Language Models","url":"https://arxiv.org/abs/2305.14283"}],"images":[{"src":"assets/chapter-20-1.png","width":1024,"height":1536}]},{"id":21,"group":"retrieval","title":{"es":"Extracción estructurada sin adivinar","en":"Structured extraction without guessing"},"kicker":{"es":"Del mensaje a campos confiables","en":"From messages to reliable fields"},"intro":{"es":"Extraer información consiste en convertir mensajes o documentos en campos que una aplicación pueda utilizar: fecha, producto, destinatario o cantidad. El reto no termina cuando el resultado cumple un esquema. También necesitas distinguir lo que la persona escribió, lo que interpretaste y lo que todavía no sabes, para evitar que una suposición active una operación.","en":"Information extraction turns messages or documents into fields an application can use: date, product, recipient, or quantity. The challenge does not end when the output matches a schema. You also need to distinguish what the person stated, what you interpreted, and what remains unknown, so that an assumption does not trigger an operation."},"explanation":{"es":"Diseña campos que permitan valores desconocidos y conserva la evidencia que justifica cada extracción. Valida formatos y restricciones con código; verifica los datos importantes contra su fuente. Una fecha bien formada puede ser la fecha equivocada, y una dirección válida sintácticamente puede pertenecer a otro destinatario.","en":"Design fields that allow unknown values and retain evidence supporting each extraction. Validate formats and constraints with code, and verify important facts against their source. A well-formed date can still be the wrong date, and a syntactically valid address can belong to the wrong recipient. Structure and truth require different checks."},"concepts":[{"title":{"es":"Estados por campo","en":"Per-field status"},"body":{"es":"Marca cada valor como explícito, interpretado o desconocido según su procedencia. Esa distinción permite decidir qué puede usarse y qué requiere confirmación.","en":"Mark values as explicit, interpreted, or unknown based on their provenance. This distinction helps decide what can be used and what requires confirmation first."}},{"title":{"es":"Validación separada","en":"Separate validation"},"body":{"es":"Comprueba tipos, rangos y reglas después de extraer. No confundas superar un validador de esquema con comprobar que el dato refleja la realidad.","en":"Check types, ranges, and rules after extraction. Passing schema validation is not the same as confirming that the extracted value accurately reflects reality."}},{"title":{"es":"Evidencia y corrección","en":"Evidence and correction"},"body":{"es":"Conserva la frase o fragmento del que salió un dato. Permite corregirlo sin perder el original y vuelve a revisar las decisiones que dependían de él.","en":"Retain the phrase or passage supporting a field. Allow corrections while preserving the original, and reconsider decisions that depended on the previous value."}}],"example":{"title":{"es":"Convertir un correo en una tarea","en":"Turning email into a task"},"body":{"es":"Un correo dice “envíame la revisión el próximo viernes”. La aplicación extrae la acción, pero resuelve la fecha usando el día y la zona horaria de la conversación. Si hay varios documentos en discusión, deja el archivo como desconocido y pregunta cuál. Solo después crea una tarea con destinatario y fecha confirmados.","en":"An email says, “Send me the revision next Friday.” The application extracts the action, then resolves the date using the conversation’s date and time zone. If several documents are being discussed, it leaves the file unknown and asks which one. Only afterward does it create a task with a confirmed recipient and deadline."}},"takeaway":{"es":"Un campo desconocido es información útil; inventar un valor destruye esa señal.","en":"An unknown field is useful information; inventing a value destroys that signal."},"videos":[{"url":"https://www.youtube.com/watch?v=zguxPRmFzxw","title":"How to Evaluate Document Extraction","channel":"LangChain","language":"EN","note":{"es":"Muestra cómo evaluar una extracción de documentos y comparar resultados estructurados con referencias, más allá de su formato.","en":"Shows how to evaluate document extraction against reference data, looking beyond the shape of structured output."}}],"sources":[{"title":"Pydantic — Models and validation","url":"https://docs.pydantic.dev/latest/concepts/models/"}],"images":[{"src":"assets/chapter-21-1.png","width":1024,"height":1536}]},{"id":22,"group":"retrieval","title":{"es":"Aclaraciones y estado conversacional","en":"Clarifications and conversational state"},"kicker":{"es":"Preguntar lo que permite avanzar","en":"Ask what unlocks progress"},"intro":{"es":"Una buena conversación no pregunta todo al principio ni intenta adivinar cada hueco. Identifica qué información falta para el siguiente paso y hace una pregunta concreta. Para conseguirlo, el asistente necesita conservar un estado claro: qué sabe, qué está pendiente y qué respuesta espera de la persona en ese momento.","en":"A good conversation neither asks everything upfront nor guesses every missing detail. It identifies the information needed for the next step and asks a focused question. To do this, the assistant needs clear state: what it knows, what remains unresolved, and which answer it currently expects from the person."},"explanation":{"es":"Separa el historial de mensajes de los datos que controlan la tarea. El historial aporta contexto; el estado registra hechos confirmados y decisiones pendientes. Cuando llega una respuesta, comprueba a qué pregunta corresponde y actualiza solo los campos relacionados. Si la respuesta corrige algo anterior, revalida lo que dependa de ese cambio.","en":"Separate message history from the data controlling the task. History provides context; state records confirmed facts and pending decisions. When an answer arrives, check which question it addresses and update only the related fields. If it corrects an earlier fact, revalidate anything that depends on the change."},"concepts":[{"title":{"es":"La próxima pregunta útil","en":"The next useful question"},"body":{"es":"Pregunta por el dato que cambia la siguiente decisión. Evita solicitar información opcional antes de saber si realmente será necesaria para completar la tarea.","en":"Ask for the fact that changes the next decision. Avoid collecting optional information before knowing whether it is actually needed to complete the task."}},{"title":{"es":"Pregunta pendiente","en":"Pending question"},"body":{"es":"Guarda qué campo estás aclarando y qué opciones ofreciste. Una respuesta corta como “la segunda” necesita ese contexto para interpretarse sin confundir operaciones.","en":"Store the field being clarified and the options offered. A short answer such as “the second one” needs that context to avoid mixing operations."}},{"title":{"es":"Confirmación proporcionada","en":"Proportionate confirmation"},"body":{"es":"Confirma los detalles que cambian el resultado o producen efectos importantes. Para preferencias reversibles, usa valores visibles que la persona pueda corregir fácilmente.","en":"Confirm details that change the outcome or cause significant effects. For reversible preferences, use visible values that the person can easily correct when needed."}}],"example":{"title":{"es":"Organizar una reunión","en":"Planning a meeting"},"body":{"es":"Una persona pide una reunión “con el equipo, la próxima semana”. El asistente identifica primero qué equipo y cuánto tiempo necesita. Después busca horarios posibles y presenta opciones. Conserva la pregunta pendiente para entender “el martes por la tarde” y muestra participantes, fecha y zona horaria antes de crear el evento.","en":"A person requests a meeting “with the team next week.” The assistant first identifies which team and the required duration. It then searches possible times and presents options. It preserves the pending question to interpret “Tuesday afternoon” and shows participants, date, and time zone before creating the event in the calendar."}},"takeaway":{"es":"El historial recuerda la conversación; un estado explícito permite continuar la tarea con precisión.","en":"History remembers the conversation; explicit state lets the task continue accurately."},"videos":[{"url":"https://www.youtube.com/watch?v=hpp2lFkxeHw","title":"Introduction to Rasa Forms | Rasa Tutorial","channel":"Rasa","language":"EN","note":{"es":"Ilustra cómo recopilar campos mediante una conversación guiada. El tutorial es de 2021; usa la documentación actual para implementarlo.","en":"Illustrates collecting fields through guided conversation. This tutorial is from 2021; use current documentation for implementation details."}}],"sources":[{"title":"Rasa — Slots","url":"https://rasa.com/docs/reference/primitives/slots/"}],"images":[{"src":"assets/chapter-22-1.png","width":1024,"height":1536}]},{"id":23,"group":"retrieval","title":{"es":"Cambios de intención y tareas paralelas","en":"Intent changes and parallel tasks"},"kicker":{"es":"Una conversación, varios objetivos","en":"One conversation, multiple goals"},"intro":{"es":"Las conversaciones reales cambian de dirección. Una persona puede corregir una solicitud, iniciar otra o volver a un asunto pendiente. El asistente necesita reconocer esas transiciones sin mezclar datos entre tareas. La continuidad del chat no significa que todas sus frases pertenezcan a la misma operación ni compartan las mismas condiciones.","en":"Real conversations change direction. A person may correct a request, start another, or return to unfinished work. The assistant needs to recognize these transitions without mixing information across tasks. Continuity of the chat does not mean that every message belongs to the same operation or shares the same conditions."},"explanation":{"es":"Representa cada tarea con su propio identificador, estado y datos confirmados. Clasifica si el mensaje continúa, modifica, añade o cambia de tarea. Si puede referirse a varias, pregunta antes de actualizar. También conviene mostrar a cuál estás respondiendo, especialmente cuando existen solicitudes parecidas en la misma conversación.","en":"Represent each task with its own identifier, state, and confirmed facts. Determine whether a message continues, modifies, adds, or switches tasks. If it could refer to several, ask before updating anything. Make the active task visible, especially when similar requests coexist within the same conversation and use overlapping vocabulary."},"concepts":[{"title":{"es":"Identidad de la tarea","en":"Task identity"},"body":{"es":"Asocia preguntas y resultados con una tarea concreta. Los datos globales del usuario y los datos particulares de una operación deben mantenerse separados.","en":"Associate questions and results with a specific task. Keep global user preferences separate from information that belongs only to one particular operation or request."}},{"title":{"es":"Cambiar sin sobrescribir","en":"Switch without overwriting"},"body":{"es":"Al iniciar otro objetivo, guarda el anterior con su progreso. Un cambio de tema no debería borrar decisiones ni transferir automáticamente fechas o destinatarios.","en":"When starting another goal, preserve the previous one and its progress. A topic change should not erase decisions or automatically transfer dates and recipients."}},{"title":{"es":"Retomar y corregir","en":"Resume and correct"},"body":{"es":"Al volver a una tarea, resume su estado y revisa datos que puedan haber cambiado. Una corrección puede invalidar opciones calculadas anteriormente.","en":"When resuming a task, summarize its state and revisit facts that may have changed. A correction can invalidate options calculated earlier in the conversation."}}],"example":{"title":{"es":"Preparar dos viajes distintos","en":"Planning two separate trips"},"body":{"es":"Una persona compara un viaje de trabajo a Madrid y otro familiar a Lisboa. Más tarde dice “cámbialo al viernes”. El asistente pregunta a cuál se refiere si el contexto no lo aclara. Después modifica solo ese viaje y mantiene separados sus pasajeros, fechas, presupuesto y decisiones pendientes.","en":"A person compares a business trip to Madrid and a family trip to Lisbon. Later they say, “Change it to Friday.” The assistant asks which trip they mean if context does not resolve it. It then updates only that trip, keeping passengers, dates, budgets, and pending decisions separate for both plans."}},"takeaway":{"es":"Mantén un estado por tarea y aclara la referencia antes de aplicar un cambio ambiguo.","en":"Maintain state per task and clarify the reference before applying an ambiguous change."},"videos":[{"url":"https://www.youtube.com/watch?v=TREEZ-vT90I","title":"Conversational AI Assistants with CALM: Handling Deviations from the Happy Path","channel":"Rasa","language":"EN","note":{"es":"Explica correcciones y cambios de contexto durante una conversación. Sirve para diseñar interrupciones sin perder el objetivo original.","en":"Explains corrections and context switches during conversations, helping you design interruptions without losing the original goal."}}],"sources":[{"title":"Rasa Learning Center — Handling deviations from the happy path","url":"https://learning.rasa.com/rasa-pro/deviations-from-happypath/"}],"images":[{"src":"assets/chapter-23-1.png","width":1024,"height":1536}]},{"id":24,"group":"production","title":{"es":"Guardrails y aprobación humana","en":"Guardrails and human approval"},"kicker":{"es":"Autonomía con límites","en":"Bounded autonomy"},"intro":{"es":"Un agente puede redactar una propuesta, consultar datos o preparar una acción sin tener permiso para ejecutarlo todo. Los guardrails comprueban condiciones durante el recorrido; la aprobación humana incorpora una decisión explícita cuando el impacto lo requiere. Ambos mecanismos se complementan con permisos reales en las herramientas y servicios conectados.","en":"An agent can draft a proposal, retrieve information, or prepare an action without having permission to execute everything. Guardrails check conditions along the way; human approval adds an explicit decision when the impact warrants it. Both mechanisms complement the actual permissions enforced by connected tools and services."},"explanation":{"es":"Diseña la revisión alrededor de una operación concreta: qué se hará, sobre qué recurso y con qué parámetros. Si cambia el destinatario, el importe o el contenido aprobado, vuelve a evaluar la autorización. Un mensaje tranquilizador del modelo no sustituye esa comprobación.","en":"Design review around a specific operation: what will happen, which resource it affects, and which parameters it uses. If the recipient, amount, or approved content changes, reassess authorization. A reassuring message from the model cannot replace that check at the moment of execution."},"concepts":[{"title":{"es":"Controles por etapa","en":"Checks at each stage"},"body":{"es":"Revisa entradas, argumentos de herramientas y salidas. Cada control responde a una pregunta distinta y debe tener una acción definida cuando falla.","en":"Check inputs, tool arguments, and outputs. Each control answers a different question and needs an explicit response when the check fails."}},{"title":{"es":"Revisión comprensible","en":"Understandable review"},"body":{"es":"Presenta la acción pendiente y sus consecuencias con claridad. La persona necesita saber exactamente qué acepta, qué puede editar y qué puede rechazar.","en":"Present the pending action and its consequences clearly. The reviewer needs to know exactly what they can approve, edit, or reject."}},{"title":{"es":"Autorización vigente","en":"Current authorization"},"body":{"es":"Comprueba identidad, permisos y versión del recurso al ejecutar. Una aprobación antigua no debe habilitar automáticamente una acción cuyos parámetros ya cambiaron.","en":"Check identity, permissions, and resource version at execution. An old approval should not automatically authorize an operation whose parameters have since changed."}}],"example":{"title":{"es":"Publicar una comunicación","en":"Publishing a communication"},"body":{"es":"Imagina un asistente que prepara un anuncio para una comunidad. Puede investigar, redactar y proponer destinatarios. Antes de publicarlo, muestra el texto y el canal elegidos. La persona confirma esa versión; si luego cambia la audiencia o se adjunta otro archivo, la publicación vuelve a revisión.","en":"Imagine an assistant preparing a community announcement. It can research, draft, and suggest recipients. Before publication, it displays the text and selected channel. A person confirms that version; if the audience later changes or another file is attached, the publication returns for another review."}},"takeaway":{"es":"La aprobación debe corresponder a la acción exacta que se ejecutará.","en":"Approval should match the exact action that will be executed."},"videos":[{"url":"https://www.youtube.com/watch?v=6t7YJcEFUIY","title":"LangGraph interrupt: Making it easier to build human-in-the-loop agents","channel":"LangChain","language":"EN","note":{"es":"Demostración oficial de cómo pausar un agente para incorporar una decisión humana y continuar después con el estado conservado.","en":"An official demonstration of pausing an agent for a human decision and continuing afterward with its execution state preserved."}}],"sources":[{"title":"LangChain · Guardrails","url":"https://docs.langchain.com/oss/python/langchain/guardrails"},{"title":"LangChain · Human-in-the-loop with interrupt","url":"https://www.langchain.com/blog/making-it-easier-to-build-human-in-the-loop-agents-with-interrupt"}],"images":[{"src":"assets/chapter-24-1.png","width":1024,"height":1536}]},{"id":25,"group":"production","title":{"es":"Políticas como código y pruebas adversariales","en":"Policy as code and adversarial tests"},"kicker":{"es":"Reglas verificables","en":"Testable rules"},"intro":{"es":"Las reglas importantes deben poder evaluarse fuera del texto de un prompt. Una política como código recibe hechos comprobados y devuelve una decisión: permitir, denegar o solicitar revisión. Las pruebas adversariales intentan encontrar solicitudes que incumplan esas reglas, incluidas reformulaciones convincentes, datos manipulados y combinaciones de permisos inesperadas.","en":"Important rules should be evaluable outside a prompt. Policy as code accepts verified facts and returns a decision: allow, deny, or request review. Adversarial tests look for requests that violate those rules, including persuasive rewordings, manipulated data, and unexpected combinations of permissions that ordinary happy-path tests can miss."},"explanation":{"es":"Separa la propuesta del agente de la decisión de autorización. Versiona las reglas, prueba sus límites y conserva los motivos de cada resultado. Una prueba útil describe el comportamiento esperado del sistema completo: por ejemplo, que nunca se comparta un documento cuando falta permiso sobre su carpeta.","en":"Separate the agent’s proposal from the authorization decision. Version the rules, test their boundaries, and retain the reasons behind each outcome. A useful test describes expected behavior of the whole system: for example, never sharing a document when permission on its folder is missing."},"concepts":[{"title":{"es":"Hechos de confianza","en":"Trusted facts"},"body":{"es":"Obtén rol, organización y permisos desde sistemas autenticados. No aceptes como prueba que el usuario escriba en el chat que es administrador.","en":"Obtain roles, organization membership, and permissions from authenticated systems. A user writing that they are an administrator is not proof of that privilege."}},{"title":{"es":"Límites explícitos","en":"Explicit boundaries"},"body":{"es":"Prueba valores justo por debajo, iguales y por encima de cada límite. Incluye campos ausentes, versiones viejas y recursos de otra organización.","en":"Test values below, equal to, and above every threshold. Include missing fields, stale versions, and resources belonging to another organization."}},{"title":{"es":"Ataques reproducibles","en":"Reproducible attacks"},"body":{"es":"Guarda solicitudes adversariales como casos de regresión. Evalúa tanto el resultado visible como las operaciones que realmente intentaron ejecutar las herramientas.","en":"Save adversarial requests as regression cases. Evaluate both the visible response and the operations that tools actually attempted to execute."}}],"example":{"title":{"es":"Compartir archivos entre equipos","en":"Sharing files across teams"},"body":{"es":"Un asistente documental recibe una petición para compartir una carpeta con una dirección externa. El motor de políticas comprueba la clasificación del contenido y los permisos del solicitante. Las pruebas incluyen mensajes urgentes y falsas instrucciones de dirección; ninguno debe saltarse la regla que exige revisión de contenido restringido.","en":"A document assistant receives a request to share a folder with an external address. The policy engine checks the content classification and requester’s permissions. Tests include urgent messages and fake management instructions; none should bypass the rule requiring review before restricted content can be shared."}},"takeaway":{"es":"Una regla fiable se ejecuta y se prueba; no depende de que el modelo la recuerde.","en":"A reliable rule is executed and tested; it does not depend on the model remembering it."},"videos":[{"url":"https://www.youtube.com/watch?v=tDBYMF2XXLA","title":"Open Policy Agent (OPA) Intro & Deep Dive - Philip Conrad, Tyler Schade, Rita Zhang & Jaydip Gabani","channel":"CNCF [Cloud Native Computing Foundation]","language":"EN","note":{"es":"Los mantenedores de OPA explican los conceptos de un motor de políticas y su aplicación a decisiones de autorización.","en":"OPA maintainers explain the core concepts of a policy engine and how to apply them to authorization decisions."}}],"sources":[{"title":"Open Policy Agent · Policy Testing","url":"https://www.openpolicyagent.org/docs/policy-testing"},{"title":"CNCF · Introduction to Policy as Code","url":"https://www.cncf.io/blog/2025/07/29/introduction-to-policy-as-code/"}],"images":[{"src":"assets/chapter-25-1.png","width":1024,"height":1536}]},{"id":26,"group":"production","title":{"es":"Trazas, auditoría y observabilidad","en":"Traces, auditing, and observability"},"kicker":{"es":"Reconstruir lo ocurrido","en":"Reconstruct what happened"},"intro":{"es":"Cuando una tarea falla, necesitas reconstruir el recorrido: qué pidió el usuario, qué servicios se consultaron, cuánto tardaron y qué resultado devolvieron. Las trazas conectan operaciones técnicas. La auditoría registra acciones relevantes y sus responsables. La observabilidad combina estas señales con métricas y registros para investigar el comportamiento del sistema.","en":"When a task fails, you need to reconstruct its journey: what the user requested, which services were called, how long they took, and what they returned. Traces connect technical operations. Auditing records meaningful actions and their actors. Observability combines these signals with metrics and logs to investigate system behavior."},"explanation":{"es":"Un tiempo de respuesta alto puede venir del modelo, una búsqueda o un servicio externo. Relaciona los pasos con identificadores comunes y registra estados útiles. Protege la información sensible: la capacidad de diagnosticar no exige copiar contraseñas, conversaciones completas ni documentos privados en cada registro.","en":"Slow responses can originate in the model, retrieval, or an external service. Connect steps with shared identifiers and record useful outcomes. Protect sensitive information: effective diagnosis does not require copying passwords, complete conversations, or private documents into every log entry or every trace span."},"concepts":[{"title":{"es":"Traza y spans","en":"Trace and spans"},"body":{"es":"Una traza representa el recorrido de una solicitud. Sus spans describen operaciones individuales, relaciones, tiempos y resultados para localizar dónde aparece un problema.","en":"A trace represents a request’s journey. Its spans describe individual operations, relationships, timings, and outcomes to identify where a problem appears."}},{"title":{"es":"Auditoría del cambio","en":"Auditing changes"},"body":{"es":"Registra quién autorizó una acción, qué recurso afectó y su resultado confirmado. No confundas una intención del agente con un cambio realmente realizado.","en":"Record who authorized an action, which resource it affected, and the confirmed outcome. An agent’s intention is not evidence of a completed change."}},{"title":{"es":"Datos mínimos útiles","en":"Useful minimum data"},"body":{"es":"Usa identificadores y metadatos pertinentes, controla el acceso y define retención. El registro técnico también puede contener información que necesita protección.","en":"Use relevant identifiers and metadata, control access, and define retention. Technical records can also contain information that requires appropriate protection."}}],"example":{"title":{"es":"Investigar una reunión duplicada","en":"Investigating a duplicate meeting"},"body":{"es":"Un asistente agenda dos reuniones cuando solo se pidió una. La traza permite detectar que la llamada al calendario se reintentó después de un timeout. El registro de auditoría identifica las dos creaciones confirmadas y quién las autorizó. Con esa evidencia puedes corregir el manejo de reintentos y deduplicación.","en":"An assistant schedules two meetings when only one was requested. The trace reveals that the calendar call was retried after a timeout. The audit record identifies both confirmed creations and who authorized them. This evidence lets you fix retry handling and deduplication instead of guessing from the final chat response."}},"takeaway":{"es":"Las trazas explican el recorrido; la auditoría documenta los cambios relevantes.","en":"Traces explain the journey; auditing documents meaningful changes."},"videos":[{"url":"https://www.youtube.com/watch?v=iZX6d0OdZys","title":"What Is MLflow? Tracing AI Agents & LLM Workflows","channel":"IBM Technology","language":"EN","note":{"es":"Presenta observabilidad de agentes y recorridos de herramientas, con ejemplos de cómo las trazas ayudan a diagnosticar y evaluar sistemas.","en":"Introduces agent observability and tool execution paths, showing how traces help diagnose behavior and evaluate the reliability of AI systems."}}],"sources":[{"title":"OpenTelemetry · Traces","url":"https://opentelemetry.io/docs/concepts/signals/traces/"},{"title":"OWASP · Logging Cheat Sheet","url":"https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"}],"images":[{"src":"assets/chapter-26-1.png","width":1024,"height":1536}]},{"id":27,"group":"production","title":{"es":"De trazas a evaluaciones y mejora continua","en":"From traces to evaluations and continuous improvement"},"kicker":{"es":"Aprender de los fallos","en":"Learn from failures"},"intro":{"es":"Observar un error sirve de poco si la siguiente versión vuelve a cometerlo. Convierte incidentes representativos en casos de evaluación: conserva una entrada anonimizada, define el resultado esperado y comprueba nuevas versiones contra el mismo criterio. Así, la experiencia real alimenta una colección de pruebas que mejora con el producto.","en":"Observing an error achieves little if the next version repeats it. Turn representative incidents into evaluation cases: retain an anonymized input, define the expected outcome, and check new versions against the same criterion. Real usage then feeds a test collection that improves alongside the product and its users."},"explanation":{"es":"Combina verificaciones automáticas con revisión humana en los aspectos que requieren juicio. Compara una versión de referencia con la candidata y examina también las regresiones. Una mejora promedio puede ocultar que ahora fallan solicitudes importantes; separa resultados por tipo de tarea, idioma y nivel de dificultad.","en":"Combine automatic checks with human review where judgment is necessary. Compare a baseline with the candidate and inspect regressions as well as improvements. Better average scores can hide failures on important requests, so break results down by task type, language, and level of difficulty."},"concepts":[{"title":{"es":"Caso reproducible","en":"Reproducible case"},"body":{"es":"Guarda el contexto necesario, las dependencias simuladas y el criterio de éxito. El caso debe poder repetirse sin ejecutar operaciones reales sobre usuarios.","en":"Retain necessary context, simulated dependencies, and a success criterion. The case should be repeatable without performing real operations against user resources."}},{"title":{"es":"Evaluación equilibrada","en":"Balanced evaluation"},"body":{"es":"Incluye casos habituales, errores conocidos y situaciones difíciles. No optimices únicamente para los ejemplos que acabas de corregir: perderías una visión representativa.","en":"Include routine cases, known failures, and difficult situations. Optimizing only for the examples you just fixed would lose a representative view of quality."}},{"title":{"es":"Comparación controlada","en":"Controlled comparison"},"body":{"es":"Prueba referencia y candidata con condiciones comparables. Anota versiones de modelos, instrucciones y herramientas para poder explicar qué cambió entre resultados.","en":"Test baseline and candidate under comparable conditions. Record model, instruction, and tool versions so differences between results can be explained."}}],"example":{"title":{"es":"Un resumen que omitió una fecha","en":"A summary that omitted a date"},"body":{"es":"Una herramienta de reuniones omitió la fecha de entrega acordada. El equipo convierte ese caso, sin datos personales, en una prueba que exige mencionar responsable y plazo cuando estén presentes. Antes de cambiar el prompt, evalúa también reuniones sin fechas explícitas para evitar que la mejora provoque plazos inventados.","en":"A meeting tool omitted an agreed deadline. The team turns an anonymized version into a test requiring the owner and due date when they are present. Before changing the prompt, it also evaluates meetings with no explicit dates, ensuring the improvement does not introduce fabricated deadlines."}},"takeaway":{"es":"Cada fallo bien entendido puede convertirse en una prueba que proteja la siguiente versión.","en":"Every well-understood failure can become a test that protects the next release."},"videos":[{"url":"https://www.youtube.com/watch?v=DpimoC1Cszg","title":"No Code LangSmith Evaluations","channel":"LangChain","language":"EN","note":{"es":"Muestra cómo evaluar configuraciones sobre un conjunto de ejemplos y comparar cambios en prompts o modelos desde una interfaz visual.","en":"Shows how to evaluate configurations on an example dataset and compare changes to prompts or models through a visual interface."}}],"sources":[{"title":"LangSmith · Evaluation types","url":"https://docs.langchain.com/langsmith/evaluation-types"},{"title":"LangSmith · Online evaluators","url":"https://docs.langchain.com/langsmith/online-evaluations-llm-as-judge"}],"images":[{"src":"assets/chapter-27-1.png","width":1024,"height":1536}]},{"id":28,"group":"production","title":{"es":"Optimizar costo, tokens y latencia","en":"Optimizing cost, tokens, and latency"},"kicker":{"es":"Eficiencia medible","en":"Measurable efficiency"},"intro":{"es":"Un agente eficiente completa la tarea con el trabajo necesario y conserva la calidad. Para mejorarlo, mide dónde se consume tiempo y presupuesto: generación, contexto, búsquedas, herramientas y reintentos. Reducir llamadas innecesarias suele ayudar, pero cada optimización debe comprobarse con tareas representativas y requisitos claros de precisión y seguridad.","en":"An efficient agent completes the task using the work it needs while preserving quality. Measure where time and budget go: generation, context, retrieval, tools, and retries. Reducing unnecessary calls often helps, but every optimization should be checked against representative tasks and explicit requirements for accuracy and safety."},"explanation":{"es":"Recorta contenido irrelevante, limita respuestas a lo que se necesita y reutiliza trabajo estable cuando el proveedor lo permita. Ejecuta en paralelo únicamente pasos independientes. Mide tanto el tiempo hasta la primera respuesta como el tiempo total: mostrar texto pronto no significa haber terminado la tarea.","en":"Remove irrelevant content, keep responses proportional to the task, and reuse stable work where the provider supports it. Parallelize only independent steps. Measure both time to first response and total completion time: showing text quickly does not mean the requested task has actually finished."},"concepts":[{"title":{"es":"Medir antes de cambiar","en":"Measure before changing"},"body":{"es":"Distingue latencia del modelo, red y herramientas. Revisa casos lentos además del promedio para encontrar qué afecta realmente la experiencia de las personas.","en":"Separate model, network, and tool latency. Inspect slow cases as well as averages to understand what actually affects the user experience."}},{"title":{"es":"Reutilización controlada","en":"Controlled reuse"},"body":{"es":"Una caché puede evitar trabajo repetido; necesita claves correctas, vigencia y aislamiento. No reutilices resultados privados entre usuarios ni datos cuya validez expiró.","en":"A cache can avoid repeated work; it needs correct keys, freshness, and isolation. Never reuse private results across users or beyond their validity."}},{"title":{"es":"Calidad por tarea","en":"Task-level quality"},"body":{"es":"Compara costo y tiempo junto al porcentaje de tareas resueltas correctamente. Un ahorro que aumenta correcciones manuales puede empeorar el costo total.","en":"Compare cost and time alongside the proportion of correctly completed tasks. Savings that increase manual correction can worsen the overall operating cost."}}],"example":{"title":{"es":"Preparar un informe semanal","en":"Preparing a weekly report"},"body":{"es":"Un asistente crea informes de varios proyectos. Puede consultar fuentes independientes en paralelo, conservar una plantilla estable y resumir solo los cambios desde el informe anterior. Para validar el ahorro, compara cobertura de novedades, precisión de cifras y tiempo total con la versión previa, no solamente el número de tokens.","en":"An assistant creates reports across several projects. It can query independent sources in parallel, keep a stable template, and summarize only changes since the previous report. Validate the savings by comparing update coverage, numerical accuracy, and completion time with the previous version, rather than counting tokens alone."}},"takeaway":{"es":"Optimizar significa resolver igual de bien con menos espera y trabajo innecesario.","en":"Optimization means solving the task just as well with less waiting and unnecessary work."},"videos":[{"url":"https://www.youtube.com/watch?v=sWgrAsKM9j8","title":"Tour De Force: LLM Inference Optimization From Simple To Sophisticated - Christin Pohl, Microsoft","channel":"PyTorch Foundation","language":"EN","note":{"es":"Profundiza en selección de modelos y técnicas de inferencia, explicando los compromisos entre latencia, rendimiento, costo y esfuerzo de implementación.","en":"Explores model selection and inference techniques, explaining the trade-offs between latency, throughput, cost, and the effort required to implement them."}}],"sources":[{"title":"Amazon Bedrock · Prompt caching","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html"},{"title":"PyTorch · LLM inference optimization talk","url":"https://www.youtube.com/watch?v=sWgrAsKM9j8"}],"images":[{"src":"assets/chapter-28-1.png","width":1024,"height":1536}]},{"id":29,"group":"production","title":{"es":"Routing adaptativo y escalamiento","en":"Adaptive routing and escalation"},"kicker":{"es":"Elegir el camino adecuado","en":"Choose the right path"},"intro":{"es":"No todas las solicitudes necesitan el mismo recorrido. Algunas se resuelven con una consulta exacta; otras requieren un modelo, una búsqueda adicional o la intervención de una persona. El routing selecciona la ruta según señales observables, como complejidad, datos disponibles, riesgo y presupuesto. Elegir un modelo más capaz no elimina la necesidad de verificar.","en":"Not every request needs the same path. Some can be resolved by an exact lookup; others need a model, additional retrieval, or a person’s involvement. Routing selects a path using observable signals such as complexity, available information, risk, and budget. Choosing a more capable model does not remove the need for verification."},"explanation":{"es":"Define rutas con responsabilidades claras y criterios de salida. Registra por qué se eligió cada una y cuánto costó. Cuando falte un dato imprescindible, preguntar puede ser mejor que escalar a otro modelo; cuando falte permiso, cambiar de modelo no debe desbloquear la acción.","en":"Define routes with clear responsibilities and exit conditions. Record why each route was chosen and what it cost. When required information is missing, asking may be better than escalating to another model; when permission is missing, changing models must not unlock the blocked operation."},"concepts":[{"title":{"es":"Señales observables","en":"Observable signals"},"body":{"es":"Usa tipo de tarea, presencia de identificadores, evidencia disponible y permisos. Una puntuación de confianza del modelo por sí sola no define una ruta segura.","en":"Use task type, identifiers, available evidence, and permissions. A model’s confidence score alone cannot define a safe route for the requested operation."}},{"title":{"es":"Escalamiento limitado","en":"Bounded escalation"},"body":{"es":"Establece un máximo de intentos y un presupuesto. Si ninguna ruta obtiene evidencia suficiente, informa la limitación o solicita una aclaración concreta.","en":"Set a maximum number of attempts and a budget. If no route obtains enough evidence, explain the limitation or ask a focused clarification."}},{"title":{"es":"Evaluar el router","en":"Evaluate the router"},"body":{"es":"Comprueba si clasifica correctamente y si la ruta elegida logra el objetivo. Incluye errores de clasificación y casos enviados innecesariamente a revisión humana.","en":"Check classification accuracy and whether the chosen path achieves the goal. Include misrouted requests and cases unnecessarily sent for human review."}}],"example":{"title":{"es":"Una bandeja de solicitudes","en":"A request inbox"},"body":{"es":"En una bandeja compartida, las consultas con un número de envío pueden ir a una consulta directa. Las preguntas abiertas sobre documentos pasan por búsqueda y síntesis. Las solicitudes de cambiar un contrato se envían a revisión. Cada ruta informa su resultado y conserva las mismas reglas de acceso.","en":"In a shared inbox, requests containing a shipment number can go to a direct lookup. Open questions about documents go through retrieval and synthesis. Contract-change requests go to a reviewer. Each route reports its outcome and preserves the same access rules, even when different models or services are involved."}},"takeaway":{"es":"El router decide cómo trabajar; la evidencia y los permisos determinan qué se puede afirmar o hacer.","en":"The router decides how to work; evidence and permissions determine what can be claimed or done."},"videos":[{"url":"https://www.youtube.com/watch?v=D_Gu_0kKOc8","title":"SLMs, LLMs, and Model Routing in Agents | Amazon Web Services","channel":"Amazon Web Services","language":"EN","note":{"es":"Explica cómo combinar modelos pequeños, modelos grandes y selección de rutas dentro de soluciones con agentes según las necesidades de cada tarea.","en":"Explains how to combine small models, large models, and routing within agent systems according to the needs of individual tasks."}}],"sources":[{"title":"Amazon Bedrock · Intelligent prompt routing","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html"},{"title":"Anthropic · Building effective agents","url":"https://www.anthropic.com/research/building-effective-agents"}],"images":[{"src":"assets/chapter-29-1.png","width":1199,"height":1312}]},{"id":30,"group":"production","title":{"es":"Fallbacks y resiliencia","en":"Fallbacks and resilience"},"kicker":{"es":"Fallar de forma controlada","en":"Fail in a controlled way"},"intro":{"es":"Una dependencia puede tardar demasiado, rechazar solicitudes o dejar de responder. La resiliencia consiste en preservar un comportamiento útil y coherente ante esos fallos. Un fallback ofrece una alternativa conocida; un reintento vuelve a probar una operación. Ninguno debería inventar datos, multiplicar acciones o esconder que una parte del trabajo sigue pendiente.","en":"A dependency may be slow, reject requests, or stop responding. Resilience preserves useful and consistent behavior when that happens. A fallback offers a known alternative; a retry attempts an operation again. Neither should invent information, multiply side effects, or hide that part of the requested work remains unfinished."},"explanation":{"es":"Clasifica los errores antes de decidir. Una interrupción temporal puede admitir reintentos limitados; permisos incorrectos suelen requerir corrección. Si una escritura queda sin respuesta, averigua su estado antes de repetirla. Ofrecer un resultado parcial claramente identificado puede ser más útil que agotar el presupuesto esperando una recuperación incierta.","en":"Classify errors before responding. A temporary interruption may justify bounded retries; incorrect permissions usually require correction. If a write receives no response, inspect its status before repeating it. A clearly labeled partial result may be more useful than exhausting the budget while waiting for uncertain recovery."},"concepts":[{"title":{"es":"Espera y reintentos","en":"Waiting and retries"},"body":{"es":"Pon límites de tiempo y separa intentos con espera creciente y variación aleatoria. Coordina reintentos entre capas para evitar multiplicar la carga.","en":"Apply time limits and space retries with increasing delays and random variation. Coordinate retries across layers to avoid multiplying load on dependencies."}},{"title":{"es":"Circuit breaker","en":"Circuit breaker"},"body":{"es":"Suspende llamadas a una dependencia que falla repetidamente y prueba su recuperación de manera controlada. Así evitas consumir recursos insistiendo durante una caída.","en":"Temporarily stop calls to a repeatedly failing dependency and probe recovery in a controlled way, avoiding wasted resources throughout the outage."}},{"title":{"es":"Resultado incierto","en":"Uncertain outcome"},"body":{"es":"Un timeout no demuestra que una acción no ocurrió. Consulta un identificador de operación o usa idempotencia antes de repetir una escritura externa.","en":"A timeout does not prove an action never happened. Inspect an operation identifier or use idempotency before repeating a write to an external system."}}],"example":{"title":{"es":"Buscar opciones de viaje","en":"Searching travel options"},"body":{"es":"Un asistente compara transporte y alojamiento. Si una fuente no responde, puede presentar las opciones verificadas de las demás y señalar qué comparación falta. Si el fallo ocurre al confirmar una reserva, mantiene el estado pendiente y consulta su identificador antes de intentar otra compra o comunicar un éxito.","en":"An assistant compares transport and accommodation. If one source is unavailable, it can show verified options from the others and identify the missing comparison. If a failure occurs while confirming a booking, it keeps the outcome pending and checks its identifier before another purchase attempt or a success message."}},"takeaway":{"es":"Recuperarse de un fallo exige conservar la verdad y el estado de las operaciones.","en":"Recovering from failure requires preserving the truth and the state of operations."},"videos":[{"url":"https://www.youtube.com/watch?v=5_Bt_OEg0no","title":"The Circuit Breaker Pattern | Resilient Microservices","channel":"Nick Chapsas","language":"EN","note":{"es":"Explica un patrón fundamental para aislar dependencias que fallan y construir servicios que se recuperan de forma controlada.","en":"Explains a foundational pattern for isolating failing dependencies and building services that recover in a controlled and predictable way."}}],"sources":[{"title":"AWS Builders’ Library · Timeouts, retries, backoff and jitter","url":"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"},{"title":"Microsoft · Circuit Breaker pattern","url":"https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker"}],"images":[{"src":"assets/chapter-30-1.png","width":1199,"height":1312}]},{"id":31,"group":"production","title":{"es":"Pruebas de caos y recuperación verificable","en":"Chaos testing and verifiable recovery"},"kicker":{"es":"Comprobar las garantías","en":"Verify the guarantees"},"intro":{"es":"Las pruebas de caos introducen fallos controlados para comprobar si el sistema mantiene sus garantías. El objetivo no es romper por romper, sino poner a prueba una hipótesis concreta: que una caída no pierda tareas, que un mensaje duplicado no repita una acción o que la recuperación respete un plazo definido.","en":"Chaos testing introduces controlled failures to check whether a system maintains its guarantees. The purpose is to test a concrete hypothesis: an outage should not lose tasks, a duplicate message should not repeat an action, or recovery should stay within a defined time limit under the conditions being tested."},"explanation":{"es":"Empieza con escenarios acotados y datos de prueba. Define qué medirás, qué eventos deben conservarse y cuándo detener el experimento. Después del fallo, verifica el estado final y los efectos externos. Que el servidor vuelva a responder no demuestra que el proceso de negocio se haya recuperado correctamente.","en":"Start with bounded scenarios and test data. Define what you will measure, which events must be retained, and when to stop the experiment. After the failure, check final state and external effects. A responsive server alone does not prove the underlying business process recovered correctly."},"concepts":[{"title":{"es":"Hipótesis comprobable","en":"Testable hypothesis"},"body":{"es":"Escribe una expectativa concreta antes de inyectar el fallo. Por ejemplo, una sola publicación confirmada aunque el servicio reciba dos entregas del mismo evento.","en":"Write a concrete expectation before injecting failure: for example, exactly one confirmed publication even when the service receives the same event twice."}},{"title":{"es":"Alcance controlado","en":"Controlled scope"},"body":{"es":"Limita recursos afectados y duración. Incluye condiciones de parada ligadas a métricas y una forma de restaurar el entorno de la prueba.","en":"Limit affected resources and duration. Include metric-based stop conditions and a clear way to restore the environment used for the experiment."}},{"title":{"es":"Verificación posterior","en":"Post-failure verification"},"body":{"es":"Comprueba conteos, estados persistidos y efectos externos después de recuperarse. Busca operaciones perdidas, duplicadas o indefinidamente pendientes, además de errores HTTP.","en":"Check counts, persisted states, and external effects after recovery. Look for lost, duplicated, or permanently pending operations as well as HTTP errors."}}],"example":{"title":{"es":"Interrumpir una exportación","en":"Interrupting an export"},"body":{"es":"Un servicio prepara un archivo grande y después notifica al usuario. En pruebas, se interrumpe el worker tras guardar el archivo pero antes de registrar la notificación. Al recuperarse, debe reconocer el archivo existente, completar el proceso y evitar duplicar avisos. La prueba examina el resultado y el historial.","en":"A service prepares a large export and then notifies the user. A test interrupts its worker after saving the file but before recording the notification. Recovery should recognize the existing file, complete the process, and prevent duplicate notices. The test examines both the final outcome and its history."}},"takeaway":{"es":"Una recuperación solo está demostrada cuando las garantías siguen cumpliéndose después del fallo.","en":"Recovery is demonstrated only when the guarantees still hold after the failure."},"videos":[{"url":"https://www.youtube.com/watch?v=AThR8dFmPP4","title":"Back to Basics: Chaos Engineering with AWS Fault Injection Simulator","channel":"Amazon Web Services","language":"EN","note":{"es":"Introducción oficial a experimentos de fallos controlados, monitoreo y recuperación, útil para diseñar hipótesis y pruebas de resiliencia.","en":"An official introduction to controlled failure experiments, monitoring, and recovery that helps frame hypotheses and design practical resilience tests."}}],"sources":[{"title":"AWS · Fault Injection Service overview","url":"https://docs.aws.amazon.com/fis/latest/userguide/what-is.html"},{"title":"AWS · Stop conditions for experiments","url":"https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html"}],"images":[{"src":"assets/chapter-31-1.png","width":1199,"height":1312}]},{"id":32,"group":"production","title":{"es":"Outbox, inbox e idempotencia distribuida","en":"Outbox, inbox, and distributed idempotency"},"kicker":{"es":"Entregas sin efectos duplicados","en":"Delivery without duplicate effects"},"intro":{"es":"Guardar un cambio en una base de datos y avisar a otro servicio son dos operaciones distintas. Si una falla, pueden quedar desincronizadas. El patrón outbox guarda el cambio y la intención de publicar juntos. Un consumidor idempotente reconoce entregas repetidas para que el mismo evento no produzca varias veces el mismo efecto.","en":"Saving a database change and notifying another service are separate operations. If either fails, the systems can become inconsistent. The outbox pattern stores the change and the publication intent together. An idempotent consumer recognizes repeated deliveries so that processing the same event does not repeatedly produce the same effect."},"explanation":{"es":"Un proceso separado entrega los eventos pendientes y registra el progreso. Puede repetir una entrega si cae después de enviarla; por eso el receptor también necesita protección. Si el consumidor realiza otra escritura externa, guardar solo que recibió el mensaje no resuelve automáticamente la consistencia de ese nuevo efecto.","en":"A separate process delivers pending events and records progress. It may repeat delivery after crashing just after a send, so the receiver also needs protection. If that consumer performs another external write, recording only that the message arrived does not automatically make the new side effect consistent."},"concepts":[{"title":{"es":"Una transacción local","en":"One local transaction"},"body":{"es":"Guarda datos de negocio y evento pendiente en la misma transacción. Así no queda confirmado el cambio sin una intención durable de comunicarlo.","en":"Store business data and the pending event in one transaction, so a committed change also has a durable intention to communicate it."}},{"title":{"es":"Identidad del evento","en":"Event identity"},"body":{"es":"Asigna un identificador estable a cada evento lógico. La deduplicación debe usarlo junto al ámbito correcto, no generar uno nuevo en cada intento.","en":"Assign a stable identifier to each logical event. Deduplication must use that identifier with the appropriate scope, rather than regenerate it on every attempt."}},{"title":{"es":"Procesamiento idempotente","en":"Idempotent processing"},"body":{"es":"Coordina el registro de recepción y la actualización local. Para efectos fuera de esa transacción, usa claves de idempotencia o un flujo recuperable adicional.","en":"Coordinate the receipt record with the local update. For effects outside that transaction, use idempotency keys or an additional recoverable workflow."}}],"example":{"title":{"es":"Una compra y su acceso digital","en":"A purchase and its digital access"},"body":{"es":"Tras confirmar una compra, una plataforma debe habilitar acceso a un curso. Guarda la compra y el evento de activación en una transacción local. Si el mensaje se entrega dos veces, el servicio receptor reconoce su identificador y mantiene una sola activación. Una tarea de seguimiento detecta eventos que siguen pendientes.","en":"After confirming a purchase, a platform must enable access to a course. It stores the purchase and activation event in one local transaction. If the message arrives twice, the receiving service recognizes its identifier and maintains a single activation. A follow-up job detects events that remain pending."}},"takeaway":{"es":"Diseña para mensajes repetidos: una entrega duplicada no debería duplicar el efecto de negocio.","en":"Design for repeated messages: duplicate delivery should not duplicate the business effect."},"videos":[{"url":"https://www.youtube.com/watch?v=D837piu2co0","title":"Ins and Outs of the Outbox Pattern (Confluent) | Current 2025","channel":"Confluent Developer","language":"EN","note":{"es":"Profundiza en garantías, consumidores idempotentes y límites del outbox, con atención a los compromisos de una implementación real.","en":"Explores outbox guarantees, idempotent consumers, and limitations, with attention to the practical trade-offs involved in implementing the pattern."}}],"sources":[{"title":"Chris Richardson · Transactional outbox","url":"https://microservices.io/patterns/data/transactional-outbox.html"},{"title":"AWS · Transactional outbox pattern","url":"https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html"}],"images":[{"src":"assets/chapter-32-1.png","width":1199,"height":1312}]},{"id":33,"group":"production","title":{"es":"Sagas, orquestación y compensaciones","en":"Sagas, orchestration, and compensation"},"kicker":{"es":"Coordinar varios sistemas","en":"Coordinate multiple systems"},"intro":{"es":"Una operación que involucra varios servicios puede quedar a medias: un paso termina y el siguiente falla. Una saga coordina transacciones locales y define cómo continuar o compensar los pasos ya realizados. La compensación es una nueva acción con significado de negocio; no siempre restaura exactamente el estado que existía antes.","en":"An operation spanning several services can stop halfway: one step succeeds and the next fails. A saga coordinates local transactions and defines how to continue or compensate for completed steps. Compensation is a new action with business meaning; it does not always restore the exact state that existed before."},"explanation":{"es":"Puedes coordinar los pasos con un orquestador central o mediante eventos entre participantes. En ambos casos necesitas registrar progreso, controlar duplicados y decidir qué fallos admiten reintento. Las compensaciones también pueden fallar: deben ser observables, repetibles de forma segura y susceptibles de intervención cuando no exista una salida automática.","en":"You can coordinate steps with a central orchestrator or through events between participants. Either approach needs progress tracking, duplicate handling, and rules for retryable failures. Compensation can fail too: it must be observable, safe to repeat, and capable of reaching human intervention when automatic recovery is impossible."},"concepts":[{"title":{"es":"Progreso persistido","en":"Persisted progress"},"body":{"es":"Conserva qué pasos terminaron y sus identificadores externos. Tras un reinicio, esa información permite decidir qué falta y qué ya no debe repetirse.","en":"Retain completed steps and their external identifiers. After a restart, this information shows what remains and which operations should not be repeated."}},{"title":{"es":"Compensación explícita","en":"Explicit compensation"},"body":{"es":"Define una acción correctiva para cada paso que lo permita. Cancelar una reserva y devolver un pago tienen condiciones distintas que deben modelarse.","en":"Define a corrective action for each step where possible. Canceling a reservation and refunding a payment have different conditions that must be modeled."}},{"title":{"es":"Consistencia visible","en":"Visible consistency"},"body":{"es":"Mientras la saga avanza, muestra estados intermedios honestos. Una operación parcialmente completada no debe presentarse como éxito definitivo a la persona usuaria.","en":"While a saga progresses, show honest intermediate states. An operation that is only partially complete must not appear as final success to the user."}}],"example":{"title":{"es":"Organizar un evento","en":"Organizing an event"},"body":{"es":"Una app reserva una sala, contrata equipamiento y confirma un anticipo. Si el equipamiento deja de estar disponible, puede buscar una alternativa o cancelar la sala según las condiciones acordadas. El proceso conserva cada confirmación y registra posibles gastos de cancelación; no supone que todas las acciones puedan deshacerse sin costo.","en":"An app reserves a room, books equipment, and confirms a deposit. If equipment becomes unavailable, it can seek an alternative or cancel the room according to agreed terms. The process retains each confirmation and records any cancellation fees; it does not assume every action can be reversed without cost."}},"takeaway":{"es":"Coordinar una saga exige diseñar tanto el camino de éxito como los de recuperación.","en":"Coordinating a saga means designing both the success path and the recovery paths."},"videos":[{"url":"https://www.youtube.com/watch?v=uHDQMfOMFD4","title":"Saga Pattern Simplified: Building Sagas with Temporal","channel":"Temporal","language":"EN","note":{"es":"Explica los retos de las sagas y cómo un motor de ejecución durable puede coordinar pasos y recuperaciones.","en":"Explains the challenges of sagas and how a durable execution engine can coordinate their steps, state, and recovery behavior."}}],"sources":[{"title":"Chris Richardson · Saga pattern","url":"https://microservices.io/patterns/data/saga.html"},{"title":"Microsoft · Compensating Transaction pattern","url":"https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction"}],"images":[{"src":"assets/chapter-33-1.png","width":1199,"height":1312}]},{"id":34,"group":"production","title":{"es":"Workflows durables y checkpoints","en":"Durable workflows and checkpoints"},"kicker":{"es":"Continuar después de una pausa","en":"Continue after a pause"},"intro":{"es":"Un proceso puede durar más que una conexión, una sesión o un servidor. La ejecución durable conserva lo necesario para continuar después de una espera o un fallo. Un checkpoint guarda un estado de progreso; otros motores reconstruyen el estado mediante un historial de eventos. La estrategia concreta depende del sistema utilizado.","en":"A process can outlive a connection, a session, or a server. Durable execution preserves what is needed to continue after a wait or a failure. A checkpoint saves progress state; other engines rebuild state from an event history. The exact strategy depends on the system used to run the workflow."},"explanation":{"es":"Separa conversación, estado del agente y proceso de negocio. Recordar mensajes no equivale a saber si una factura se emitió. Las operaciones externas necesitan identificadores y una estrategia de repetición segura. Reanudar el código no garantiza, por sí solo, que nunca se duplique un efecto en otro servicio.","en":"Separate conversation, agent state, and business workflow. Remembering messages is not equivalent to knowing whether an invoice was issued. External operations need identifiers and a safe repetition strategy. Resuming code does not, by itself, guarantee that an effect in another service can never be duplicated."},"concepts":[{"title":{"es":"Puntos de recuperación","en":"Recovery points"},"body":{"es":"Guarda estado suficiente en momentos definidos y comprueba que pueda recuperarse. Un checkpoint solo en memoria no protege frente a la caída del proceso.","en":"Persist sufficient state at defined points and verify it can be recovered. An in-memory checkpoint does not protect against the process itself crashing."}},{"title":{"es":"Efectos separados","en":"Separate side effects"},"body":{"es":"Mantén explícitos los pasos que llaman servicios o modifican recursos. Al repetir la ejecución, distingue resultados ya confirmados de operaciones que siguen pendientes.","en":"Keep service calls and resource mutations explicit. During recovery, distinguish already confirmed results from operations that remain pending or have uncertain outcomes."}},{"title":{"es":"Compatibilidad al reanudar","en":"Resume compatibility"},"body":{"es":"Los procesos antiguos pueden continuar después de actualizar el código. Planifica versiones de estado y cambios compatibles para no romper ejecuciones que estaban pausadas.","en":"Old processes may continue after a code update. Plan state versions and compatible changes so paused executions can resume without breaking."}}],"example":{"title":{"es":"Revisar y publicar un documento","en":"Reviewing and publishing a document"},"body":{"es":"Un asistente prepara un documento y espera varios días a que dos personas lo revisen. El servidor se reinicia durante la espera. Un workflow durable conserva la versión pendiente y las revisiones recibidas; al volver, continúa desde el punto válido y publica solo cuando se cumplen las condiciones acordadas.","en":"An assistant prepares a document and waits several days for two reviewers. The server restarts during that wait. A durable workflow retains the pending version and received reviews; after recovery, it continues from a valid point and publishes only when the agreed conditions have been met."}},"takeaway":{"es":"La memoria de conversación conserva el diálogo; la durabilidad conserva el progreso ejecutable.","en":"Conversation memory preserves the dialogue; durability preserves executable progress."},"videos":[{"url":"https://www.youtube.com/watch?v=w4spcXq5uCw","title":"Why Every AI Agent Needs Durable Execution | Temporal, Samar Abbas","channel":"Lightspeed Venture Partners","language":"EN","note":{"es":"El cofundador de Temporal explica por qué los agentes de larga duración necesitan persistencia, recuperación y coordinación confiable.","en":"Temporal’s co-founder explains why long-running agents need persistence, recovery, and dependable coordination as they move into practical production workflows."}}],"sources":[{"title":"Temporal · Workflows and replay","url":"https://docs.temporal.io/workflows"},{"title":"LangGraph · Persistence","url":"https://docs.langchain.com/oss/python/langgraph/persistence"}],"images":[{"src":"assets/chapter-34-1.png","width":1246,"height":1263}]},{"id":35,"group":"production","title":{"es":"Temporizadores durables y vencimiento de aprobaciones","en":"Durable timers and approval expiry"},"kicker":{"es":"El tiempo también es estado","en":"Time is also state"},"intro":{"es":"Una aprobación pendiente necesita reglas claras sobre cuánto tiempo sigue siendo válida. Un temporizador durable conserva el vencimiento aunque se reinicie el servidor. Al combinarlo con respuestas humanas, pueden llegar eventos casi simultáneos: aprobación y expiración. El sistema debe resolver esa competencia de forma consistente y conservar un único resultado final.","en":"A pending approval needs clear rules about how long it remains valid. A durable timer retains the deadline even if the server restarts. When combined with human responses, approval and expiry can arrive almost simultaneously. The system must resolve that competition consistently and preserve one final outcome for the request."},"explanation":{"es":"Guarda el plazo y usa una referencia temporal autorizada del servidor, no el reloj del navegador. Aceptar o expirar debe ser una transición controlada desde pendiente. Distingue recordatorio y vencimiento: un aviso puede retrasarse, pero eso no debe extender silenciosamente la validez de la aprobación.","en":"Store the deadline and use authoritative server time rather than the browser clock. Approval or expiration must be a controlled transition from pending. Distinguish reminders from deadlines: a notification may arrive late, but that delay must not silently extend the validity of the approval request."},"concepts":[{"title":{"es":"Plazo persistido","en":"Persisted deadline"},"body":{"es":"Conserva cuándo vence la solicitud y qué versión se está revisando. Al recuperarse, el sistema debe comprobar vencimientos que ocurrieron durante la interrupción.","en":"Retain when the request expires and which version is under review. On recovery, the system must check deadlines reached during the interruption."}},{"title":{"es":"Una transición ganadora","en":"One winning transition"},"body":{"es":"Coordina aprobación y expiración mediante el motor de workflow o una actualización atómica condicionada al estado. Solo una ruta puede cerrar la misma solicitud.","en":"Coordinate approval and expiry through the workflow engine or an atomic update conditional on state. Only one path may close the same request."}},{"title":{"es":"Notificaciones idempotentes","en":"Idempotent notifications"},"body":{"es":"Identifica cada aviso y vuelve a comprobar el estado antes de enviarlo. Así evitas recordatorios innecesarios o duplicados después de una decisión final.","en":"Identify each notice and recheck state before sending it, preventing unnecessary or duplicate reminders after a final decision has already been recorded."}}],"example":{"title":{"es":"Aprobar una reserva temporal","en":"Approving a temporary booking"},"body":{"es":"Una sala se mantiene pendiente hasta que el organizador confirme antes de las 16:00. El sistema envía un recordatorio y guarda el vencimiento. Si la confirmación llega cuando se libera la sala, una transición controlada decide el resultado; la interfaz muestra aprobado o vencido según el estado persistido, sin decisiones contradictorias.","en":"A room is held pending confirmation before 16:00. The system sends a reminder and retains the deadline. If confirmation arrives while the room is being released, a controlled transition determines the result. The interface displays approved or expired according to persisted state, avoiding contradictory decisions across different screens."}},"takeaway":{"es":"Una aprobación tardía no debe reactivar una solicitud que ya venció.","en":"A late approval must not reactivate a request that has already expired."},"videos":[{"url":"https://www.youtube.com/watch?v=xwsAv1jcTag","title":"Free Your Mind, Your App Will Follow | Temporal's Principal Developer Advocate speaks @ Replay 2026","channel":"Temporal","language":"EN","note":{"es":"Una demostración de workflows y temporizadores persistentes ilustra cómo coordinar esperas, eventos externos y recuperación ante fallos.","en":"A demonstration of persistent workflows and timers illustrates how to coordinate waiting periods, external events, and recovery from failures."}}],"sources":[{"title":"Temporal · Durable timers in TypeScript","url":"https://docs.temporal.io/develop/typescript/workflows/timers"},{"title":"PostgreSQL · Conditional UPDATE","url":"https://www.postgresql.org/docs/current/sql-update.html"}],"images":[{"src":"assets/chapter-35-1.png","width":1199,"height":1312}]}]}</script>
